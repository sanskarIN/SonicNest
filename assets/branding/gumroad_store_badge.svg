<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">Ram Sandesh Gumroad storefront badge</title>
  <desc id="desc">A custom storefront badge highlighting https://ramsandesh.gumroad.com.</desc>
  <defs>
    <linearGradient id="bag" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff5d8f"/>
      <stop offset="0.55" stop-color="#f01883"/>
      <stop offset="1" stop-color="#7c1bd1"/>
    </linearGradient>
    <linearGradient id="link" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ef2f6f"/>
      <stop offset="0.55" stop-color="#b019b8"/>
      <stop offset="1" stop-color="#5a16c8"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff2b82"/>
      <stop offset="1" stop-color="#8d13cc"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#11162d" flood-opacity="0.2"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <rect x="180" y="45" width="985" height="240" rx="58" fill="#ffffff" stroke="#10162f" stroke-width="10"/>
    <rect x="470" y="10" width="505" height="72" rx="36" fill="#ffd648" stroke="#10162f" stroke-width="8"/>
    <text x="722" y="58" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="800" fill="#10162f">VISIT MY STORE ♥</text>

    <path d="M67 98h150l23 165c2 17-10 32-27 32H72c-17 0-30-15-27-32L67 98z" fill="url(#bag)" stroke="#10162f" stroke-width="10"/>
    <path d="M91 105V74c0-42 30-64 56-64s56 22 56 64v31" fill="none" stroke="#10162f" stroke-width="16" stroke-linecap="round"/>
    <circle cx="142" cy="191" r="58" fill="#ffd6ea" stroke="#10162f" stroke-width="8"/>
    <text x="142" y="213" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="76" font-weight="900" fill="#10162f">G</text>

    <text x="310" y="170" font-family="Arial, Helvetica, sans-serif" font-size="95" font-weight="900" fill="#10162f">Gum</text>
    <text x="525" y="170" font-family="Arial, Helvetica, sans-serif" font-size="95" font-weight="900" fill="url(#road)">road</text>

    <rect x="270" y="196" width="835" height="88" rx="44" fill="url(#link)" stroke="#ffffff" stroke-width="7"/>
    <circle cx="320" cy="240" r="25" fill="#ffffff" fill-opacity="0.96"/>
    <path d="M311 246l18-18m-10-4l7-7c9-9 24 5 15 14l-7 7m-24 18l-7 7c-9 9-24-5-15-14l7-7" fill="none" stroke="#8e1bc6" stroke-width="5" stroke-linecap="round"/>
    <text x="365" y="252" font-family="Arial, Helvetica, sans-serif" font-size="37" font-weight="750" fill="#ffffff">https://ramsandesh.gumroad.com</text>
    <circle cx="1060" cy="240" r="29" fill="#ffffff"/>
    <path d="M1048 250l24-24m-15 0h15v15" fill="none" stroke="#9a1bc2" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
