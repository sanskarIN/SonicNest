name: sonic_nest
description: Privacy-first, cross-platform sound and voice recorder.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  file_picker: 10.3.10
  ffmpeg_kit_flutter_new_audio: ^2.5.0
  intl: ^0.20.3
  just_audio: ^0.10.6
  just_audio_background: 0.0.1-beta.17
  just_audio_media_kit: ^2.1.0
  media_kit_libs_linux: ^1.2.1
  media_kit_libs_windows_audio: ^1.0.9
  path: ^1.9.1
  path_provider: ^2.1.6
  record: ^7.1.1
  share_plus: ^12.0.2
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2
  uuid: ^4.6.0
  wakelock_plus: 1.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/logo/sonicnest_logo.svg
    - assets/logo/sonicnest_mark.svg

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/generated/sonicnest_icon.png
  image_path_android: assets/generated/sonicnest_icon.png
  adaptive_icon_background: "#4856E8"
  adaptive_icon_foreground: assets/generated/sonicnest_icon_foreground.png
  adaptive_icon_monochrome: assets/generated/sonicnest_icon_foreground.png
  adaptive_icon_foreground_inset: 18
  min_sdk_android: 23
  image_path_ios: assets/generated/sonicnest_icon.png
  remove_alpha_ios: true
  background_color_ios: "#4856E8"
  windows:
    generate: true
    image_path: assets/generated/sonicnest_icon.png
    icon_size: 256
  macos:
    generate: true
    image_path: assets/generated/sonicnest_icon.png

flutter_native_splash:
  color: "#F7F7FC"
  color_dark: "#14141C"
  image: assets/generated/sonicnest_splash.png
  android: true
  ios: true
  web: false
  android_min_sdk: 23
  android_12:
    color: "#F7F7FC"
    color_dark: "#14141C"
    image: assets/generated/sonicnest_icon_foreground.png
    icon_background_color: "#4856E8"
    icon_background_color_dark: "#4856E8"
