name: macOS Build

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'lib/**'
      - 'macos/**'
      - 'ios/**'
      - 'pubspec.yaml'
      - 'tool/**'

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: bash tool/bootstrap_platforms.sh
      - run: flutter pub get
      - run: flutter build macos --debug
