name: Temporary Final Evidence And Audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temporary-final-evidence-and-audit.yml'

permissions:
  contents: write
  actions: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Finalize evidence, self-clean, and audit final main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main
          git reset --hard origin/main

          python - <<'PY'
          from pathlib import Path

          qa = Path('docs/QA_CHECKLIST.md')
          text = qa.read_text(encoding='utf-8')
          old = '- [x] Linux Package CI run `31783749267` validated source `f2c773e59b27a2aaac77e0590e20441ed7eba03f` and built/structurally verified `sonicnest_0.1.0_amd64.deb` successfully.'
          stronger = '- [x] Linux Package CI run `31785105648` validated source `a07468b4b7c14a76b9bce537bbe0455e4539e6bf` through release build, `.deb` construction, structural verification, package-manager installation, installed-payload validation, bounded virtual-display startup smoke, package-manager removal, uninstall cleanup verification, and artifact upload.'
          audit = '- [x] Repository Integrity Audit run `31785152042` validated revision `e0b9658a4cb18a61ac42046a6914ca080df7eb51` after the installed-package smoke script and install/remove CI markers became protected repository invariants.'
          historical = '- [x] Historical Linux Package CI run `31783749267` validated source `f2c773e59b27a2aaac77e0590e20441ed7eba03f` and built/structurally verified `sonicnest_0.1.0_amd64.deb` successfully.'
          if stronger not in text:
              if old not in text:
                  raise SystemExit('Expected historical Linux package evidence line not found')
              text = text.replace(old, '\n'.join((historical, stronger, audit)), 1)
          elif audit not in text:
              text = text.replace(stronger, stronger + '\n' + audit, 1)
          qa.write_text(text, encoding='utf-8')
          PY

          cat > /tmp/sonicnest-final-evidence.md <<'EOF'

---

# Hosted-runner Debian install/startup/uninstall smoke continuation — 2026-08-14

The Debian package gate was extended beyond package-archive inspection. This continuation adds a disposable hosted-runner install/startup/uninstall layer without changing the evidence boundary for real Linux audio or release approval.

## Installed-package smoke script

Added `tool/smoke_test_installed_linux_deb.sh` in commit `45c94018c9c9c8074421e419125e38fe2b29c4d3`.

The script validates an actually installed SonicNest package by checking:

- `dpkg-query` reports `sonicnest` as installed;
- `/opt/sonicnest/sonic_nest` exists and is executable;
- the installed desktop entry exists and still targets `/opt/sonicnest/sonic_nest`;
- the installed hicolor SonicNest icon exists and is non-empty;
- AppStream metadata exists with the expected application and lowercase developer identifiers;
- LICENSE and NOTICE exist in the installed package documentation directory;
- `desktop-file-validate` and `appstreamcli validate --no-net` pass when available;
- the installed GUI can enter a bounded startup window under `xvfb-run` with software rendering;
- obvious segmentation-fault, symbol-lookup, and shared-library-loader failures are rejected.

The bounded virtual-display launch is a startup smoke test only. It does not assert microphone capture, real desktop integration, hardware acceleration quality, accessibility, media routing, or long-duration stability.

## Linux Package CI install/remove extension

Commit `a07468b4b7c14a76b9bce537bbe0455e4539e6bf` extended `.github/workflows/linux-package.yml` so the package job now builds and structurally verifies the release `.deb`, installs it through `apt-get`, verifies the installed package and metadata, runs the bounded virtual-display startup smoke, removes the package, verifies package-owned integration cleanup, and uploads the validation artifact.

## Exact stronger Linux validation

Linux Package CI run `31785105648` validated source revision `a07468b4b7c14a76b9bce537bbe0455e4539e6bf` with the complete stronger package path green:

- Linux release build: SUCCESS.
- Debian package build: SUCCESS.
- structural package verification: SUCCESS.
- desktop-entry validation: SUCCESS.
- AppStream validation: SUCCESS.
- package checksum verification: SUCCESS.
- package metadata/content inspection: SUCCESS.
- package-manager installation: SUCCESS.
- installed-payload/metadata verification: SUCCESS.
- virtual-display packaged-app startup smoke: SUCCESS.
- package-manager removal: SUCCESS.
- package-owned integration cleanup after uninstall: SUCCESS.
- validation artifact upload: SUCCESS.

The earlier structural-only run `31783749267` remains historical evidence, but run `31785105648` supersedes it as the current automated Linux package gate.

## Repository invariant protection

`tool/repository_audit.py` was extended in commit `e0b9658a4cb18a61ac42046a6914ca080df7eb51` so it requires the installed-package smoke script and the package install/smoke/remove workflow markers. Repository Integrity Audit run `31785152042` passed on that revision.

## Evidence boundary

The hosted-runner smoke does not complete representative Debian/Ubuntu installation evidence, real launcher/menu/task-switcher/AppStream visual inspection, microphone permission/capture and PulseAudio/PipeWire routing, built-in/wired/USB/Bluetooth input testing, accessibility review, representative upgrade testing, low-storage/long-duration tests, real user workloads, the public Linux distribution-channel decision, or package/repository signing policy. Those gates remain unchecked. SonicNest remains a **development preview** until the required real-system and cross-platform release evidence is complete.
EOF

          python - <<'PY'
          from pathlib import Path
          ledger = Path('what_changed.md')
          text = ledger.read_text(encoding='utf-8')
          marker = '# Hosted-runner Debian install/startup/uninstall smoke continuation — 2026-08-14'
          if marker not in text:
              addition = Path('/tmp/sonicnest-final-evidence.md').read_text(encoding='utf-8')
              ledger.write_text(text + addition, encoding='utf-8')
          PY

          for file in \
            .github/workflows/temporary-smoke-evidence-finalization.yml \
            .github/workflows/temporary-smoke-evidence-finalization-v2.yml \
            .github/workflows/temporary-smoke-evidence-finalization-v3.yml \
            .github/workflows/temporary-final-evidence-and-audit.yml; do
            if git ls-files --error-unmatch "$file" >/dev/null 2>&1; then
              git rm "$file"
            fi
          done

          grep -Fq '31785105648' docs/QA_CHECKLIST.md
          grep -Fq '# Hosted-runner Debian install/startup/uninstall smoke continuation — 2026-08-14' what_changed.md
          if git ls-files '.github/workflows/temporary-*' | grep -q .; then
            echo 'Temporary workflow remains tracked.' >&2
            git ls-files '.github/workflows/temporary-*' >&2
            exit 1
          fi
          git diff --check

          git config user.name 'Sanskar'
          git config user.email 'sanskarin@outlook.in'
          git add docs/QA_CHECKLIST.md what_changed.md
          git add -u .github/workflows
          if ! git diff --cached --quiet; then
            git commit -m 'docs: finalize installed Debian smoke evidence'
          fi

          git pull --rebase origin main
          FINAL_SHA="$(git rev-parse HEAD)"
          git push origin HEAD:main

          gh workflow run repository-audit.yml --ref main

          RUN_ID=''
          for _ in $(seq 1 30); do
            RUN_ID="$(gh run list --workflow repository-audit.yml --branch main --limit 20 --json databaseId,headSha --jq '.[] | select(.headSha == "'"$FINAL_SHA"'") | .databaseId' | head -n1)"
            if [ -n "$RUN_ID" ]; then
              break
            fi
            sleep 4
          done

          if [ -z "$RUN_ID" ]; then
            echo "Could not locate repository audit run for $FINAL_SHA" >&2
            exit 1
          fi

          gh run watch "$RUN_ID" --exit-status
          echo "Final repository audit run: $RUN_ID"
          echo "Final main commit: $FINAL_SHA"
