name: One-shot diagnostics documentation ledger

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-diagnostics-docs.yml'

permissions:
  contents: write

jobs:
  update-ledgers:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure commit identity
        run: |
          git config user.name "Sanskar"
          git config user.email "sanskarin@outlook.in"
      - name: Update documentation files
        run: python3 tool/one_shot_update_diagnostics_docs.py
      - name: Commit release notes
        run: |
          git add RELEASE_NOTES.md
          git diff --cached --quiet || git commit -m "docs: add diagnostics QA release notes"
      - name: Commit project state
        run: |
          git add PROJECT_STATE.md
          git diff --cached --quiet || git commit -m "docs: sync diagnostics project state"
      - name: Commit change ledger
        run: |
          git add what_changed.md
          git diff --cached --quiet || git commit -m "docs: record diagnostics and QA continuation"
      - name: Push documentation commits
        run: git push origin HEAD:main
