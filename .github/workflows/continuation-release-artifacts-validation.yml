name: One-shot unsigned release-candidate artifact validation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/continuation-release-artifacts-validation.yml'

permissions:
  contents: write

jobs:
  preflight:
    name: Source preflight
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg pulseaudio-utils libjson-glib-dev
      - run: bash tool/release_preflight.sh

  android:
    name: Android release-mode artifacts
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: bash tool/bootstrap_platforms.sh
      - run: flutter pub get
      - run: bash tool/apply_branding.sh
      - run: |
          flutter build apk --release
          flutter build appbundle --release
      - run: |
          mkdir -p build/release-candidate/android
          cp build/app/outputs/flutter-apk/app-release.apk build/release-candidate/android/sonicnest-android-release-unsigned.apk
          cp build/app/outputs/bundle/release/app-release.aab build/release-candidate/android/sonicnest-android-release-unsigned.aab
          printf '%s\n' 'SonicNest validation artifact. Not approved for public/store distribution.' > build/release-candidate/android/RELEASE_CANDIDATE_WARNING.txt
          cd build/release-candidate/android
          sha256sum sonicnest-android-release-unsigned.apk sonicnest-android-release-unsigned.aab > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: validation-android-release-candidate
          path: build/release-candidate/android
          if-no-files-found: error
          retention-days: 1

  linux:
    name: Linux release-mode artifact
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev ffmpeg pulseaudio-utils libjson-glib-dev
      - run: flutter config --enable-linux-desktop
      - run: bash tool/bootstrap_platforms.sh
      - run: flutter pub get
      - run: dart tool/generate_brand_assets_v2.dart
      - run: flutter build linux --release
      - run: |
          mkdir -p build/release-candidate/linux
          tar -C build/linux/x64/release -czf build/release-candidate/linux/sonicnest-linux-release-unsigned.tar.gz bundle
          printf '%s\n' 'SonicNest validation artifact. Not a finalized Linux package.' > build/release-candidate/linux/RELEASE_CANDIDATE_WARNING.txt
          cd build/release-candidate/linux
          sha256sum sonicnest-linux-release-unsigned.tar.gz > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: validation-linux-release-candidate
          path: build/release-candidate/linux
          if-no-files-found: error
          retention-days: 1

  windows:
    name: Windows release-mode artifact
    needs: preflight
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter config --enable-windows-desktop
      - shell: pwsh
        run: ./tool/bootstrap_platforms.ps1
      - run: flutter pub get
      - shell: pwsh
        run: ./tool/apply_branding.ps1
      - run: flutter build windows --release
      - shell: pwsh
        run: |
          $Out = 'build\release-candidate\windows'
          New-Item -ItemType Directory -Force -Path $Out | Out-Null
          $Zip = Join-Path $Out 'sonicnest-windows-release-unsigned.zip'
          Compress-Archive -Path 'build\windows\x64\runner\Release\*' -DestinationPath $Zip -Force
          'SonicNest validation artifact. Unsigned and not approved for public distribution.' | Set-Content -Path (Join-Path $Out 'RELEASE_CANDIDATE_WARNING.txt') -Encoding UTF8
          $Hash = (Get-FileHash -Algorithm SHA256 $Zip).Hash.ToLowerInvariant()
          "$Hash  sonicnest-windows-release-unsigned.zip" | Set-Content -Path (Join-Path $Out 'SHA256SUMS.txt') -Encoding ASCII
      - uses: actions/upload-artifact@v4
        with:
          name: validation-windows-release-candidate
          path: build/release-candidate/windows
          if-no-files-found: error
          retention-days: 1

  macos:
    name: macOS release-mode artifact
    needs: preflight
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter config --enable-macos-desktop
      - run: bash tool/bootstrap_platforms.sh
      - run: flutter pub get
      - run: bash tool/apply_branding.sh
      - run: flutter build macos --release
      - run: |
          set -euo pipefail
          OUT=build/release-candidate/macos
          mkdir -p "$OUT"
          APP_PATH="$(find build/macos/Build/Products/Release -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$OUT/sonicnest-macos-release-unsigned.zip"
          printf '%s\n' 'SonicNest validation artifact. Not signed/notarized for public distribution.' > "$OUT/RELEASE_CANDIDATE_WARNING.txt"
          (cd "$OUT" && shasum -a 256 sonicnest-macos-release-unsigned.zip > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: validation-macos-release-candidate
          path: build/release-candidate/macos
          if-no-files-found: error
          retention-days: 1

  ios:
    name: iOS no-codesign release-mode artifact
    needs: preflight
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: bash tool/bootstrap_platforms.sh
      - run: flutter pub get
      - run: bash tool/apply_branding.sh
      - run: flutter build ios --release --no-codesign
      - run: |
          set -euo pipefail
          OUT=build/release-candidate/ios
          mkdir -p "$OUT"
          APP_PATH="$(find build/ios/iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$OUT/sonicnest-ios-release-unsigned.zip"
          printf '%s\n' 'SonicNest validation artifact. No codesign and not an installable App Store package.' > "$OUT/RELEASE_CANDIDATE_WARNING.txt"
          (cd "$OUT" && shasum -a 256 sonicnest-ios-release-unsigned.zip > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: validation-ios-release-candidate
          path: build/release-candidate/ios
          if-no-files-found: error
          retention-days: 1

  record:
    name: Record validated release automation
    needs: [preflight, android, linux, windows, macos, ios]
    if: success()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Append release automation evidence
        env:
          VALIDATED_SHA: ${{ github.sha }}
          VALIDATION_RUN_ID: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          sha = os.environ['VALIDATED_SHA']
          run_id = os.environ['VALIDATION_RUN_ID']

          what = Path('what_changed.md')
          text = what.read_text(encoding='utf-8')
          marker = '# Unsigned release-candidate automation continuation'
          if marker not in text:
              text += f'''\n\n---\n\n# Unsigned release-candidate automation continuation\n\nRepository-only release hardening added after native branding validation:\n\n- Added `tool/release_preflight.sh` and `tool/release_preflight.ps1`.\n- Preflight regenerates platform hosts, resolves dependencies, applies deterministic native branding, enforces Dart formatting, runs Flutter analysis, and runs unit tests.\n- Added permanent manual `.github/workflows/release-candidate.yml`.\n- The workflow builds release-mode Android APK/AAB, Linux bundle archive, Windows archive, macOS application archive, and unsigned iOS application archive.\n- Every packaged artifact includes an explicit non-publication warning and a SHA-256 checksum file.\n- Artifact generation does not use maintainer production signing credentials and does not claim installability/store approval.\n- Release-mode artifacts are intended for validation/preparation only until all physical-device, accessibility, branding, signing, packaging, and store gates are complete.\n\nExact validation:\n\n- Source/workflow revision: `{sha}`\n- Validation run: `{run_id}`\n- Release preflight: SUCCESS\n- Android release-mode APK/AAB build, package copy, SHA-256 generation, artifact upload: SUCCESS\n- Linux release-mode build, archive, SHA-256 generation, artifact upload: SUCCESS\n- Windows release-mode build, archive, SHA-256 generation, artifact upload: SUCCESS\n- macOS release-mode build, archive, SHA-256 generation, artifact upload: SUCCESS\n- unsigned iOS release-mode build, archive, SHA-256 generation, artifact upload: SUCCESS\n\nThese automated artifacts remain intentionally **unsigned/non-store-ready validation outputs**.\n'''
              what.write_text(text, encoding='utf-8')

          state = Path('PROJECT_STATE.md')
          stext = state.read_text(encoding='utf-8')
          marker = '## Latest exact validation — unsigned release-candidate automation'
          if marker not in stext:
              stext += f'''\n\n{marker}\n\n- Revision: `{sha}`\n- Run: `{run_id}`\n- Release preflight: **SUCCESS**\n- Android release-mode APK/AAB: **SUCCESS**\n- Linux release-mode archive: **SUCCESS**\n- Windows release-mode archive: **SUCCESS**\n- macOS release-mode application archive: **SUCCESS**\n- unsigned iOS release-mode application archive: **SUCCESS**\n- Each validation artifact includes a SHA-256 checksum and explicit non-publication warning.\n- Production signing/notarization/store packaging remain maintainer-owned manual gates.\n'''
              state.write_text(stext, encoding='utf-8')
          PY
      - run: git rm .github/workflows/continuation-release-artifacts-validation.yml
      - name: Commit release automation evidence
        run: |
          git config user.name 'Sanskar'
          git config user.email 'sanskarin@outlook.in'
          git add what_changed.md PROJECT_STATE.md
          git commit -m 'docs: record validated unsigned release automation'
          git push origin HEAD:main
