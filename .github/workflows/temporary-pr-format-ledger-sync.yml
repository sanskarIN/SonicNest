name: Temporary PR formatter and ledger sync

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  format-and-sync:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Apply hosted stable Dart formatter exactly
        run: dart format lib test tool/generate_brand_assets_v2.dart
      - name: Synchronize reliability ledgers additively
        shell: bash
        run: |
          set -euo pipefail

          marker='# Continuation — 2026-08-18 — Reliability and persistence hardening'
          if ! grep -Fq "$marker" what_changed.md; then
            cat >> what_changed.md <<'EOF'

# Continuation — 2026-08-18 — Reliability and persistence hardening

## Scope completed in this continuation

This continuation stayed inside repository-owned work that can be implemented and validated without pretending that physical-device, accessibility, stress, protected-signing, notarization, store-console, or final stable-release gates are complete.

### Cross-platform recording filename safety

- Sanitizes caller-provided fallback names as well as normal recording titles.
- Protects Windows reserved device names, including suffix forms such as `CON.notes`, `COM1.session`, and `LPT9.archive`.
- Truncates by Unicode code point rather than a UTF-16 boundary.
- Bounds filename stems to 120 Unicode code points and 220 UTF-8 bytes so common filesystem component limits still have headroom for extensions and collision suffixes.
- Adds regression coverage for unsafe characters, reserved names, malformed fallbacks, long ASCII, long Unicode, UTF-8 byte limits, and preserved multilingual names.

### Coherent settings persistence

- Replaces seven independent preference writes with one versioned canonical JSON snapshot under `settings_snapshot_v1`.
- Keeps legacy per-field keys readable as migration and corruption fallback, while new saves write only the canonical snapshot.
- Ensures a valid canonical snapshot wins over stale legacy values.
- Falls back safely when the canonical snapshot is damaged.
- Adds roundtrip, canonical-precedence, migration, corruption, and wrong-type regression coverage.

### Persisted integer integrity

- Corrupted decimal values in integer settings are no longer silently truncated into apparently valid values.
- Bitrate, sample rate, channel count, and countdown parsing now require finite whole numbers before conversion.
- Existing clamping behavior for valid whole-number out-of-range values remains intact.
- Regression coverage proves fractional persisted values return the established safe defaults.

### Import cleanup isolation

- `AudioImportService` now preserves its structured `AudioImportException` even if cleanup of a copied invalid import also fails.
- Cleanup failure is retained as diagnostic context instead of escaping as an unrelated filesystem exception that could abort a surrounding batch unexpectedly.
- Regression coverage injects both the media validation failure and cleanup failure.

### Generated path extension boundary

- `StorageService` validates generated extension text before joining it into recording, Trash, or temporary paths.
- Safe alphanumeric extensions are normalized to lowercase after removing one optional leading dot.
- Empty, separator-containing, traversal-shaped, or otherwise invalid extension values are rejected with `FormatException`.
- Regression coverage rejects `../wav`, `txt/../../outside`, and empty extension input, and verifies `.PCM` normalizes to `.pcm` inside managed temporary storage.

## Validation evidence

For PR #1 restored head `b24954a284fa043c95b9c385cef1193cdc57e129`:

- Repository Integrity Audit completed successfully.
- Linux Package CI completed successfully, including release bundle build, Debian package creation and verification, package metadata inspection, install, smoke test, uninstall, and artifact upload.
- Windows Build completed successfully, including debug build plus release portable package creation, verification, startup smoke test, and artifact upload.
- Apple Builds completed successfully for iOS no-codesign debug and macOS debug.
- Flutter CI's Linux debug build completed successfully.
- The Flutter analyze/test job stopped at the committed-format gate because hosted Flutter stable 3.47.0 still found two continuation regression files non-canonical. The permanent gate was not weakened. This PR uses the same hosted stable formatter to apply the exact canonical output before its final validation pass.

## Integration history

- PR #1: `Harden generated file extension boundaries`.
- PR #1 reviewed head: `b24954a284fa043c95b9c385cef1193cdc57e129`.
- PR #1 merge commit: `a9dc730eba9811103c7f7267431664cda522c66f`.
- The follow-up settings numeric-integrity work is isolated in PR #2 and is not treated as integrated until that PR is merged.

## Release boundary

SonicNest remains a **development preview**. Still open are physical microphone permissions/capture/routing, wired/USB/Bluetooth behavior, interruption/background/lock-screen/media-button behavior, real low-storage/permission/process/power-loss recovery, representative malformed/partial/damaged media, large-library and long-duration performance, accessibility audits, real native visual review/screenshots, representative Linux/Windows package QA on real target systems, Android/Apple/Windows protected signing, notarization/store-console validation, and final stable-release approval.
EOF
          fi

          state_marker='## 2026-08-18 reliability hardening state'
          if ! grep -Fq "$state_marker" PROJECT_STATE.md; then
            cat >> PROJECT_STATE.md <<'EOF'

## 2026-08-18 reliability hardening state

- PR #1 was integrated at merge commit `a9dc730eba9811103c7f7267431664cda522c66f`.
- Cross-platform filename sanitation covers fallback text, Windows reserved-name suffixes, Unicode code-point integrity, and bounded UTF-8 component size.
- Settings persist through canonical versioned snapshot `settings_snapshot_v1` with legacy read migration/corruption fallback.
- Persisted integer fields reject fractional values instead of truncating corrupted decimals into valid-looking settings.
- Audio import cleanup failure cannot replace the structured import failure boundary with an unrelated filesystem exception.
- Generated recording/Trash/temp extension text is validated and normalized before path allocation; traversal-shaped extensions are rejected.
- PR #1 validation passed Repository Integrity Audit, Linux package CI, Windows build/package CI, Apple iOS/macOS builds, and the Flutter Linux debug build. Its analyze/test job stopped only at the two-file committed-format gate, which the follow-up PR corrects using hosted Flutter stable's exact formatter output.
- Release classification remains `development_preview_until_manual_release_gates_are_complete`; no physical-device, accessibility, stress, protected-signing, notarization, store-console, or stable-release gate is closed by this work.
EOF
          fi

          evidence_marker='## Validation update — 2026-08-18'
          if ! grep -Fq "$evidence_marker" docs/RELIABILITY_HARDENING_2026-08-18.md; then
            cat >> docs/RELIABILITY_HARDENING_2026-08-18.md <<'EOF'

## Validation update — 2026-08-18

The completed restored-head PR #1 matrix produced successful Repository Integrity Audit, Linux package CI, Windows build/package CI, Apple iOS/macOS builds, and Flutter Linux debug-build evidence. The Flutter analyze/test job stopped at the committed-format gate because hosted Flutter stable 3.47.0 found only `test/audio_import_service_test.dart` and `test/settings_service_test.dart` still non-canonical. The follow-up PR applies the hosted stable formatter exactly and retains the permanent non-mutating formatter gate.
EOF
          fi

          git rm .github/workflows/temporary-pr-format-ledger-sync.yml
          git config user.name 'Sanskar'
          git config user.email 'sanskarin@outlook.in'
          git add lib test tool what_changed.md PROJECT_STATE.md docs/RELIABILITY_HARDENING_2026-08-18.md
          if ! git diff --cached --quiet; then
            git commit -m 'style: apply hosted formatter and sync reliability ledgers'
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
