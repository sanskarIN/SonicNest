name: One-shot QA Transfer Ledger Sync

on:
  push:
    branches: [main]
    paths:
      - 'tool/qa_transfer_ledger_once.py'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Configure commit identity
        run: |
          git config user.name 'Sanskar'
          git config user.email 'sanskarin@outlook.in'
      - name: Apply ledger updates
        run: python3 tool/qa_transfer_ledger_once.py
      - name: Commit project state
        run: |
          git add PROJECT_STATE.md
          git commit -m 'docs: sync project state after QA transfer'
      - name: Commit changelog
        run: |
          git add CHANGELOG.md
          git commit -m 'docs: record QA evidence transfer changes'
      - name: Commit release notes
        run: |
          git add RELEASE_NOTES.md
          git commit -m 'docs: add QA evidence transfer release notes'
      - name: Commit roadmap
        run: |
          git add ROADMAP.md
          git commit -m 'docs: record QA evidence consolidation milestone'
      - name: Commit remaining-work boundary
        run: |
          git add TODO.md
          git commit -m 'docs: keep QA transfer manual gates explicit'
      - name: Commit continuation log
        run: |
          git add what_changed.md
          git commit -m 'docs: record QA transfer continuation'
      - name: Push ledger commits
        run: |
          set -euo pipefail
          git pull --rebase origin main
          git push origin HEAD:main
