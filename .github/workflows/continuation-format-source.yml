name: One-shot normalize checked-in Dart formatting

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/continuation-format-source.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Format repository Dart sources
        run: dart format lib test tool/generate_brand_assets_v2.dart
      - name: Remove one-shot formatter
        run: git rm .github/workflows/continuation-format-source.yml
      - name: Commit formatter output
        run: |
          git config user.name 'Sanskar'
          git config user.email 'sanskarin@outlook.in'
          git add lib test tool/generate_brand_assets_v2.dart
          if git diff --cached --quiet; then
            git commit -m 'chore: remove one-shot source formatter'
          else
            git commit -m 'style: normalize Dart source formatting'
          fi
          git push origin HEAD:main
