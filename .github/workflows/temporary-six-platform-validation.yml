name: Temporary Six-Platform Ledger Append

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temporary-six-platform-validation.yml'

permissions:
  contents: write

jobs:
  append-ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Append additive cross-platform continuation ledger
        shell: bash
        run: |
          set -euo pipefail
          {
            cat <<'EOF'

# Continuation — 2026-08-20 — Six-platform Web expansion

## Goal

Expand SonicNest from its previous five native Flutter targets into a six-target cross-platform application while preserving native functionality and adding an explicit browser-safe capability boundary.

## Platform contract

SonicNest now targets:

- Android
- iOS
- macOS
- Windows
- Linux
- Web / modern browsers

The normal `lib/main.dart` entry point is shared by every target. Conditional bootstrap isolates Dart IO/native dependencies from the browser compilation graph.

## Runtime implementation

- Added `lib/bootstrap/bootstrap.dart` with conditional exports for `dart.library.io` and `dart.library.js_interop`.
- Moved the existing native startup/service graph into `lib/bootstrap/bootstrap_native.dart`.
- Added `lib/bootstrap/bootstrap_web.dart` and an explicit unsupported-runtime fallback.
- Added `lib/main_web.dart` as the browser-safe SonicNest recorder surface.
- Added browser microphone permission handling and input-device enumeration/selection.
- Added browser PCM16 stream capture with mono/stereo requests, automatic gain, echo cancellation, and noise suppression requests where supported by the browser/runtime.
- Added browser pause, resume, stop, cancel, live amplitude metering, and elapsed-time behavior.
- Added in-memory browser-session recording management so Web does not pretend native managed-filesystem persistence exists.
- Added byte-backed WAV playback through `just_audio` without writing browser recordings to native filesystem paths.
- Added explicit share/download through `share_plus` with browser download fallback.
- Kept native FFmpeg editing, durable managed Library/Trash/recovery, native foreground services, and native media-session behavior out of the Web dependency graph instead of exposing non-functional browser controls.

## WAV implementation and tests

- Added `lib/core/wav_encoder.dart` as a pure-Dart PCM16 RIFF/WAVE container writer.
- WAV generation validates positive sample rate, mono/stereo channel count, and complete 16-bit samples.
- Added `test/wav_encoder_test.dart` covering RIFF/WAVE headers, mono/stereo byte-rate/block-alignment behavior, payload preservation, and invalid inputs.

## Platform bootstrap and branding

- `tool/bootstrap_platforms.sh` now generates `android,ios,macos,linux,windows,web`.
- `tool/bootstrap_platforms.ps1` now generates the same six hosts.
- `pubspec.yaml` enables Web launcher/icon generation.
- `pubspec.yaml` enables Web splash generation.
- `tool/apply_branding.sh` and `tool/apply_branding.ps1` now require and brand the generated Web host alongside native hosts.
- Repository integrity treats committed top-level `web/` scaffolding the same as generated native host scaffolding: it must remain reproducible rather than becoming authoritative committed generated source.

## CI and release-candidate integration

- Core Flutter CI now contains a dedicated Web release build using `flutter build web --release` through the shared default entry point.
- Manual Release Candidate Validation now contains a Web release-mode job.
- The Web candidate is archived as `sonicnest-web-release.tar.gz` with an explicit development-preview warning and SHA-256 record.
- The unified candidate provenance manifest now requires Android, Linux, Windows, macOS, iOS, and Web.
- Web candidate classification records that native binary signing is not applicable to the static Web bundle while retaining `development-preview` distribution status.
- Missing or tampered Web candidate bytes fail the same checksum/provenance contract used for native payloads.

## Regression and repository-contract coverage

- Added `tool/tests/test_web_platform_contract.py`.
- Extended `test/bootstrap_integrity_test.dart` to lock six-target bootstrap, conditional default entry point, and core Web build behavior.
- Extended release-candidate manifest tests with Web payload inclusion and tamper rejection.
- Extended release-candidate workflow integration tests with Web job/artifact/provenance markers.
- Extended repository required-surface tests with Web source/docs/tests.
- Extended `tool/repository_audit.py` to require Web source, docs, QA, bootstrap, branding, CI, release-candidate, provenance, and generated-host invariants.

## Documentation and release policy

- Added `docs/WEB_SUPPORT.md`.
- Added `docs/WEB_QA_CHECKLIST.md` covering Chromium, Firefox, Safari/WebKit, permission/device behavior, WAV integrity, playback/share, responsive/accessibility behavior, PWA/installability, production HTTPS/cache/security/rollback, and privacy.
- Updated README, documentation index, architecture, building, codec, branding, release procedure, candidate-artifact guide, provenance guide, release evidence template, TODO, and PROJECT_STATE for the six-platform contract.
- Preserved the 2026-08-15 hosted release-candidate/provenance runs as historical five-platform evidence only; they are not retroactively described as validating Web.

## Validation boundary

- A full temporary exact-source Flutter validation workflow was attempted for this continuation, but no success-marker ledger commit was observable through the available repository connector before this cleanup pass.
- Therefore this continuation does **not** claim fresh hosted Flutter/analyzer/test/build success for the current six-platform revision.
- `TODO.md` intentionally keeps fresh current-revision core CI, Repository Integrity Audit, manual six-platform Release Candidate Validation, real-browser QA, production signing/notarization/store review, and production Web-hosting evidence open.
- Historical green 2026-08-15 runs remain evidence only for their exact pre-Web source revisions.

EOF
            printf -- '- Ledger append source revision: `%s`\n' "$GITHUB_SHA"
            cat <<'EOF'
- The temporary write-enabled ledger workflow is removed immediately after this append so permanent repository workflow policy returns to the maintained read-only allowlist.

## Release classification

SonicNest remains a **development preview**. Six-platform source/configuration/documentation support is implemented; stable/public release claims remain evidence-driven by `TODO.md`, `docs/QA_CHECKLIST.md`, `docs/WEB_QA_CHECKLIST.md`, and `docs/RELEASING.md`.
EOF
          } >> what_changed.md

          git config user.name 'Sanskar'
          git config user.email 'sanskarin@outlook.in'
          git add what_changed.md
          git commit -m 'docs: append six-platform Web continuation'
          git push
