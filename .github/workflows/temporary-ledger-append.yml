name: Temporary Reliability Ledger Append

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temporary-ledger-append.yml'

permissions:
  contents: write

jobs:
  append-ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Append continuation and self-remove
        shell: bash
        run: |
          set -euo pipefail
          MARKER='# Metadata integrity and resilient import continuation — 2026-08-14'
          CONTENT_B64=''
          if ! grep -Fq "$MARKER" what_changed.md; then
            printf '%s' "$CONTENT_B64" | base64 --decode >> what_changed.md
          fi
          grep -Fq "$MARKER" what_changed.md
          git diff --check
          git rm .github/workflows/temporary-ledger-append.yml
          git config user.name 'Sanskar'
          git config user.email 'sanskarin@outlook.in'
          git add what_changed.md
          git commit -m 'docs: append metadata and import continuation'
          git push origin HEAD:main
