name: One-shot continuation ledger sync

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/zz-continuation-ledger-sync.yml'

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure commit identity
        run: |
          git config user.name "Sanskar"
          git config user.email "sanskarin@outlook.in"
      - name: Update QA evidence
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('docs/QA_CHECKLIST.md')
          s = p.read_text()
          marker = 'The automated entries above do **not** complete the unchecked real malformed-media corpus'
          block = '''- [x] Managed storage now requires a supported regular audio file and refuses symbolic links, directories, unsupported regular files, and external paths as recording authority.\n- [x] Managed and external destination allocation treats ordinary files, directories, symbolic links, and broken symbolic links as occupied instead of overwriting/following them.\n- [x] Recording/Trash statistics and automatic sequence counting are covered against the same supported top-level regular-audio definition used by recovery.\n- [x] Active and managed-Trash orphan reconstruction plus startup removal of unsafe/missing/unsupported metadata is covered end-to-end by controller tests.\n- [x] A completed stopped recording whose metadata save fails remains on disk for later orphan recovery while its unsaved in-memory entry is removed.\n- [x] Failed processed-output and batch-registration cleanup is covered so a generated managed output can be removed without deleting a caller-supplied external path.\n- [x] Deterministic batch conversion tests cover per-file transcode failure isolation, external-copy failure isolation, stop-before/after-current behavior, and source-setting precedence.\n- [x] Recorder-service construction no longer eagerly instantiates the native recorder method channel; the backend is created only when recorder functionality is actually used.\n- [x] Core Flutter CI run `31870224720` validated source/test revision `e47b290a7255f126cfcf1436444a90cc32d10823`: analyzer **SUCCESS**, complete **87/87** unit suite **SUCCESS**, Android debug build **SUCCESS**, and Linux debug build **SUCCESS**.\n- [x] Windows run `31870087266`, Apple run `31870087249`, and Linux Package CI run `31870087317` are **SUCCESS** on application-code revision `72797fa477b9d88e2138b7ddf1d0f845cdd549ca`, which contains the final application code changes; `e47b290...` is a later test-only correction.\n- [ ] Checked-in Dart formatting is not yet clean under the CI Flutter/Dart toolchain: core run `31870224720` formatted 30 of 54 Dart files before analysis/tests. This repository-hygiene gap is tracked in `TODO.md` and must not be represented as formatter-clean release evidence.\n\n'''
          if 'Core Flutter CI run `31870224720`' not in s:
              s = s.replace(marker, block + marker)
          p.write_text(s)
          PY
          git add docs/QA_CHECKLIST.md
          git commit -m "docs: record final recovery and batch QA evidence"
      - name: Update changelog
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('CHANGELOG.md')
          s = p.read_text()
          added = '''- `BatchConversionService` as the production sequential batch execution boundary with deterministic per-file conversion/export failure isolation and stop-after-current behavior.\n- Supported-regular-audio and symbolic-link/non-file regression coverage for managed storage, startup reconciliation, storage accounting, and external copy destinations.\n- `docs/LOCALIZATION_POLICY.md` defining localized product text versus intentionally raw technical diagnostic evidence.\n- `docs/LINUX_DISTRIBUTION_POLICY.md` selecting GitHub Releases with verified Debian `.deb` plus SHA-256 checksum as the initial public Linux channel, without an initial custom APT repository.\n- End-to-end controller startup reconciliation tests covering unsafe metadata removal plus active and Trash orphan reconstruction.\n'''
          changed = '''- Managed audio authority now requires a supported extension and a regular file inspected without following symbolic links; path text inside `Recordings`/`.trash` alone is insufficient.\n- Recording/Trash storage totals and automatic recording sequence counting now use the same supported top-level regular-audio definition as recovery.\n- External export collision detection now treats files, directories, symbolic links, broken links, and uninspectable destination paths as occupied.\n- Batch Convert now delegates its production loop to the tested `BatchConversionService`; leaving the screen raises the same stop-after-current request instead of intentionally starting another item.\n- `RecorderService` now lazily constructs `AudioRecorder`, eliminating constructor-time native method-channel side effects while preserving production recorder behavior when used.\n- Linux distribution policy is now decided: GitHub Releases is the initial `.deb` channel; maintainer signing credentials remain outside the repository.\n- Backend diagnostic localization policy is now decided: user-facing summaries are localized while raw OS/plugin/FFmpeg/filesystem details remain technical evidence.\n'''
          fixed = '''- Controller recovery tests no longer instantiate the native recorder backend merely by constructing/disposal of a recorder service.\n- The stopped-recording metadata-persistence rollback test now creates its completed file after startup so it tests stop-time failure rather than being correctly consumed by startup orphan recovery.\n- Generated batch-output cleanup now checks managed-audio authority before deletion, preventing cleanup from deleting an external caller path.\n- External-copy filename allocation no longer selects a basename occupied by a directory or broken symbolic link.\n'''
          validation = '''- Core Flutter CI run `31870224720` is fully green on source/test revision `e47b290a7255f126cfcf1436444a90cc32d10823`: static analysis, all 87 unit tests, Android debug APK, and Linux debug build succeeded.\n- Windows run `31870087266`, Apple run `31870087249`, and Linux Package CI run `31870087317` are green on application-code revision `72797fa477b9d88e2138b7ddf1d0f845cdd549ca`, covering Windows debug, macOS debug, unsigned-iOS debug, and the verified Debian package path.\n- CI currently formats 30 of 54 checked-in Dart files before analysis/tests; this is tracked as an unresolved repository-hygiene item and is not claimed as formatter-clean source evidence.\n'''
          if '`BatchConversionService` as the production sequential batch execution boundary' not in s:
              s = s.replace('### Added\n', '### Added\n' + added, 1)
              s = s.replace('### Changed\n', '### Changed\n' + changed, 1)
              s = s.replace('### Fixed\n', '### Fixed\n' + fixed, 1)
              s = s.replace('### Validation\n', '### Validation\n' + validation, 1)
          p.write_text(s)
          PY
          git add CHANGELOG.md
          git commit -m "docs: record storage batch and release hardening changes"
      - name: Update release notes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('RELEASE_NOTES.md')
          s = p.read_text()
          marker = '## 2026-08-15 — Managed storage, recovery, batch, and release-policy hardening'
          block = '''\n\n## 2026-08-15 — Managed storage, recovery, batch, and release-policy hardening\n\nThis development-preview continuation tightens the local-data boundary and makes the tested batch path the production batch path. Managed recording authority now requires a supported regular audio file in SonicNest-managed active/Trash storage; symbolic links, directories, unsupported regular files, missing paths, and external paths are not trusted as recording instructions. Startup reconciliation and orphan recovery preserve active-versus-Trash state, and recording/Trash accounting follows the same supported top-level regular-audio definition.\n\nExternal copy allocation is now entity-aware, so directories and broken symbolic links occupy names just like existing files. `BatchConversionService` owns sequential conversion, managed registration, optional external copy, failure isolation, generated-output cleanup, progress, and stop-after-current semantics; `BatchConvertScreen` uses that service directly. Leaving the screen requests stop after the current item instead of intentionally starting another selected conversion.\n\n`RecorderService` now lazily creates the native `AudioRecorder` backend. Controller/service construction no longer touches the native method channel until recorder functionality is requested, which removes a unit-test/native-channel coupling without bypassing microphone permission or production recorder checks.\n\nThe project also now has explicit policy decisions for future localization and Linux distribution. Product-facing text is localized while raw OS/plugin/FFmpeg/filesystem diagnostics remain technical evidence. The initial public Linux channel is GitHub Releases with the verified Debian `.deb` and SHA-256 checksum; SonicNest does not initially operate a custom APT repository and does not claim signing that has not actually been performed with maintainer-owned credentials.\n\nValidation evidence: core run `31870224720` is green on revision `e47b290a7255f126cfcf1436444a90cc32d10823` for static analysis, all 87 unit tests, Android debug, and Linux debug. Windows run `31870087266`, Apple run `31870087249`, and Linux Package CI run `31870087317` are green on application-code revision `72797fa477b9d88e2138b7ddf1d0f845cdd549ca`; the later `e47b290...` change corrects only a persistence test fixture.\n\nOne repository-hygiene item remains explicit: the core job currently formats 30 of 54 checked-in Dart files before analysis/tests. Behavior validation is green on the formatted checkout, but the tracked tree is not yet claimed formatter-clean. Physical-device, filesystem-failure, accessibility, long-duration, representative-package, signing, and stable-release evidence remains intentionally incomplete.\n'''
          if marker not in s:
              s += block
          p.write_text(s)
          PY
          git add RELEASE_NOTES.md
          git commit -m "docs: add current development preview hardening notes"
      - name: Update project state
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('PROJECT_STATE.md')
          s = p.read_text()
          if 'public_channel: GitHub Releases' not in s:
              s = s.replace('  installed_smoke_script: tool/smoke_test_installed_linux_deb.sh\n', '  installed_smoke_script: tool/smoke_test_installed_linux_deb.sh\n  public_channel: GitHub Releases\n  public_artifacts: verified Debian .deb + SHA-256 checksum\n  apt_repository: not initially operated\n  signing_credentials: maintainer-owned and outside repository\n')
          features = '''  - supported-extension regular-file managed audio boundary with symbolic-link and non-file refusal\n  - entity-safe collision allocation for managed and external destinations including broken symbolic links\n  - active and Trash orphan reconstruction with startup unsafe-metadata removal\n  - managed-audio-only recording and Trash statistics plus sequence counting\n  - deterministic BatchConversionService used by the production Batch Convert screen\n  - stop-after-current behavior shared by the Batch Convert stop control and screen disposal\n  - lazy native AudioRecorder construction without constructor-time method-channel side effects\n  - localization policy separating translated product summaries from raw technical diagnostic evidence\n  - GitHub Releases selected as the initial public Linux Debian package channel\n'''
          if '  - deterministic BatchConversionService used by the production Batch Convert screen\n' not in s:
              s = s.replace('partial_features:\n', features + 'partial_features:\n', 1)
          s = s.replace('  - English is the only shipped locale; backend diagnostic and error text localization policy must be decided before additional locales are released', '  - English is the only shipped locale; diagnostic-text policy is decided, while additional locales still require translation review, text-expansion testing, and accessibility QA')
          s = s.replace('  - Debian package structure and hosted-runner install/startup/uninstall smoke are automated but representative-system microphone routing desktop rendering accessibility upgrade and signing/distribution policy remain manual release gates', '  - Debian package structure and hosted-runner install/startup/uninstall smoke are automated and the initial GitHub Releases channel is selected, while representative-system microphone routing desktop rendering accessibility upgrade and any optional public artifact-signing credentials remain manual release gates')
          new_validation = '''latest_automated_validation:\n  application_code_commit: 72797fa477b9d88e2138b7ddf1d0f845cdd549ca\n  final_source_test_revision: e47b290a7255f126cfcf1436444a90cc32d10823\n  core_flutter_ci:\n    run_id: 31870224720\n    source_commit: e47b290a7255f126cfcf1436444a90cc32d10823\n    analyzer: success\n    unit_tests: success_87_of_87\n    android_debug_apk: success\n    linux_debug_build: success\n    formatting_note: CI formatted 30 of 54 checked-in Dart files before analyzer/tests; tracked tree is not yet formatter-clean\n  windows_ci:\n    run_id: 31870087266\n    source_commit: 72797fa477b9d88e2138b7ddf1d0f845cdd549ca\n    windows_debug_build: success\n  apple_ci:\n    run_id: 31870087249\n    source_commit: 72797fa477b9d88e2138b7ddf1d0f845cdd549ca\n    macos_debug_build: success\n    ios_debug_no_codesign: success\n  linux_package_ci:\n    run_id: 31870087317\n    source_commit: 72797fa477b9d88e2138b7ddf1d0f845cdd549ca\n    result: success\n    package_target: Debian .deb\n    public_channel_policy: GitHub Releases with verified .deb and SHA-256 checksum\n  validation_relationship:\n    - application-code revision 72797fa477b9d88e2138b7ddf1d0f845cdd549ca contains the final application source changes and is green in Windows Apple and Linux-package workflows\n    - source/test revision e47b290a7255f126cfcf1436444a90cc32d10823 is a later test-only correction and is green in core analyzer 87-test Android and Linux validation\n    - documentation-only commits after these revisions do not alter the validated application code\nknown_limitations:'''
          s = re.sub(r'latest_automated_validation:\n.*?\nknown_limitations:', new_validation, s, count=1, flags=re.S)
          if 'checked-in Dart tree currently has formatter drift' not in s:
              s = s.replace('known_limitations:\n', 'known_limitations:\n  - checked-in Dart tree currently has formatter drift; core CI formats 30 of 54 Dart files before analysis/tests and TODO tracks committing formatter output plus later non-mutating enforcement\n', 1)
          s = s.replace('  - decide the public Linux distribution channel and any Debian repository/package signing policy\n', '')
          s = s.replace('  - decide backend diagnostic text localization policy before adding additional languages\n', '')
          if '  - commit the CI-toolchain Dart formatter output and then make formatting a non-mutating enforcement gate\n' not in s:
              s = s.replace('next_exact_tasks:\n', 'next_exact_tasks:\n  - commit the CI-toolchain Dart formatter output and then make formatting a non-mutating enforcement gate\n', 1)
          marker = '## Latest exact validation — storage, recovery, batch, and lazy-recorder hardening'
          if marker not in s:
              s += '''\n\n## Latest exact validation — storage, recovery, batch, and lazy-recorder hardening\n\n- Final application-code revision: `72797fa477b9d88e2138b7ddf1d0f845cdd549ca`.\n- Final source/test revision: `e47b290a7255f126cfcf1436444a90cc32d10823`; its additional change is a test-fixture correction, not application code.\n- Core Flutter CI run `31870224720`: analyzer **SUCCESS**, complete **87/87** test suite **SUCCESS**, Android debug **SUCCESS**, Linux debug **SUCCESS**.\n- Windows run `31870087266`: Windows debug build **SUCCESS** on the final application-code revision.\n- Apple run `31870087249`: macOS debug and unsigned-iOS debug builds **SUCCESS** on the final application-code revision.\n- Linux Package CI run `31870087317`: Debian package workflow **SUCCESS** on the final application-code revision.\n- Initial Linux public channel decision: GitHub Releases with verified `.deb` plus SHA-256 checksum; no initial custom APT repository.\n- Diagnostic localization decision: translate product-facing summaries; preserve raw OS/plugin/FFmpeg/filesystem backend detail as technical evidence.\n- Formatter boundary: core CI currently mutates formatting for 30 of 54 Dart files before analysis/tests. The tracked tree is therefore **not yet claimed formatter-clean**; this is explicitly tracked in `TODO.md`.\n- Release classification remains **development preview** until the remaining physical-device, real-filesystem, accessibility, representative-package, long-duration, signing, and stable-release gates are completed.\n'''
          p.write_text(s)
          PY
          git add PROJECT_STATE.md
          git commit -m "docs: synchronize final hardening project state"
      - name: Append continuation ledger
        shell: bash
        run: |
          QA_SHA=$(git log -1 --format=%H -- docs/QA_CHECKLIST.md)
          CHANGELOG_SHA=$(git log -1 --format=%H -- CHANGELOG.md)
          RELEASE_SHA=$(git log -1 --format=%H -- RELEASE_NOTES.md)
          STATE_SHA=$(git log -1 --format=%H -- PROJECT_STATE.md)
          export QA_SHA CHANGELOG_SHA RELEASE_SHA STATE_SHA
          python3 - <<'PY'
          from pathlib import Path
          import os
          p = Path('what_changed.md')
          s = p.read_text()
          marker = '## 2026-08-15 — Storage boundary, batch execution, release-policy, and validation continuation'
          if marker not in s:
              s += f'''\n\n{marker}\n\nThis section is additive. All earlier continuation history above remains intact.\n\n### Managed storage authority and filesystem safety\n\n- `StorageService` now treats a path as managed audio only when it is inside the allowed active/Trash location, has a supported recording extension, and resolves to a regular file when inspected with symbolic-link following disabled.\n- Rename, duplicate, move-to-Trash, restore, and permanent-delete guards therefore refuse external paths, unsupported regular files, symbolic links, directories, and other non-regular filesystem entries.\n- Managed destination allocation checks `FileSystemEntity.type(..., followLinks: false)` and treats ordinary files, directories, symbolic links, broken symbolic links, and uninspectable paths as occupied.\n- Recording/Trash counts and byte totals now use the same supported top-level regular-audio definition used by startup recovery. Temporary processing storage remains separate because backend work products can legitimately use non-audio/nested artifacts.\n- Automatic recording sequence counting now counts managed active/Trash audio rather than unrelated directory contents; collision-safe destination allocation remains the final overwrite guard.\n- Startup reconciliation is covered end-to-end for safe indexed entries, unsafe external/unsupported/missing metadata removal, active orphan reconstruction, Trash orphan reconstruction, and no duplicate reconstruction across restart.\n\n### External export collision hardening\n\n- External copy allocation is now entity-aware rather than regular-file-only. A destination basename occupied by a directory, symbolic link, or broken symbolic link is not selected for overwrite/following.\n- Batch original export still preserves successful copies when a later source fails.\n- Deterministic tests cover ordinary collisions, directory collisions, broken-link collisions on supported hosts, missing sources, unavailable destinations, duplicate basenames, and mixed-success batches.\n\n### Batch conversion production service\n\n- Added `lib/services/batch_conversion_service.dart` as the deterministic sequential execution boundary used by production Batch Convert.\n- The service prefers known source bitrate/sample-rate/channel metadata and falls back to current recording settings only when source values are unknown.\n- Each conversion is registered into the managed Library before an optional external-folder copy. An external-copy failure therefore does not invalidate a conversion already preserved in SonicNest.\n- Per-file transcode/registration failure is isolated; later files continue unless a stop request is active.\n- Failed generated-output registration removes the output only when storage confirms it is eligible managed audio. A caller-supplied external path is preserved.\n- Stop behavior is explicitly "Stop after current file": the service checks before starting an item and after completing the current item rather than forcibly terminating FFmpeg mid-write.\n- `BatchConvertScreen` now delegates to this service. Disposing/leaving the screen raises the same stop request so another selected item is not intentionally started after the current conversion completes.\n- `test/batch_conversion_service_test.dart` covers transcode failure isolation, registration cleanup, external-output protection, external-copy isolation, stop-before/after-current behavior, progress, and source technical-setting precedence.\n\n### Recorder construction hardening\n\n- `RecorderService` no longer instantiates `AudioRecorder` in its constructor. The native recorder backend is created lazily when input-device/permission/capture functionality actually needs it.\n- This removes constructor/disposal-time native method-channel side effects from pure controller tests without weakening production microphone permission checks or recorder capability checks.\n- After the lazy-backend change, the controller suite reached real persistence logic instead of failing during native plugin construction.\n\n### Persistence-test correction\n\n- The stopped-recording metadata-save regression initially created its output before `AppController.initialize()`. With active orphan recovery implemented, startup correctly reconstructed that file, so the fixture was testing the wrong phase.\n- The corrected test creates the completed managed audio after startup and then injects metadata-save failure during `stopRecording()`.\n- The expected invariant is now tested directly: the unsaved in-memory entry is removed, the completed managed audio remains on disk, and restart recovery can reconstruct it later.\n\n### Localization policy decision\n\n- Added `docs/LOCALIZATION_POLICY.md`.\n- Ordinary product-facing labels, actions, confirmations, summaries, and high-level errors belong in localization.\n- Raw operating-system, plugin, FFmpeg, filesystem, path, and backend diagnostic detail remains technical/source-language evidence unless SonicNest maps a stable backend code to its own localized message.\n- Diagnostic evidence remains privacy-sensitive and is not uploaded automatically.\n- Additional locales remain gated on translation review, expansion/layout checks, plural behavior, accessibility, and RTL review where applicable.\n\n### Linux public distribution policy decision\n\n- Added `docs/LINUX_DISTRIBUTION_POLICY.md`.\n- The initial public Linux channel is GitHub Releases with the repository-verified Debian `.deb` plus SHA-256 checksum.\n- SonicNest does not initially operate a custom APT repository, so APT repository-index signing is not applicable to this first channel.\n- Development-preview CI packages may remain unsigned but cannot be represented as signed stable artifacts. Any future signature policy uses maintainer-owned credentials outside the repository.\n- Real representative-system install/audio/desktop/accessibility/upgrade evidence remains a stable-release gate.\n\n### Documentation synchronized in this continuation\n\nUpdated or added: `README.md`, `SECURITY.md`, `TODO.md`, `docs/ARCHITECTURE.md`, `docs/BATCH_CONVERSION.md`, `docs/LINUX_DISTRIBUTION_POLICY.md`, `docs/LOCALIZATION_POLICY.md`, `docs/MANAGED_STORAGE_BOUNDARY.md`, `docs/METADATA_INTEGRITY.md`, `docs/RECOVERY_INDEX.md`, `docs/RELEASING.md`, `docs/TROUBLESHOOTING.md`, `docs/USER_GUIDE.md`, `docs/QA_CHECKLIST.md`, `CHANGELOG.md`, `RELEASE_NOTES.md`, `PROJECT_STATE.md`, and this additive ledger.\n\nLedger/state synchronization commits generated in this final pass:\n\n- `{os.environ['QA_SHA']}` — `docs: record final recovery and batch QA evidence`.\n- `{os.environ['CHANGELOG_SHA']}` — `docs: record storage batch and release hardening changes`.\n- `{os.environ['RELEASE_SHA']}` — `docs: add current development preview hardening notes`.\n- `{os.environ['STATE_SHA']}` — `docs: synchronize final hardening project state`.\n- this `what_changed.md` append commit follows those records.\n\n### Exact application/source validation relationship\n\nApplication-code revision:\n\n- `72797fa477b9d88e2138b7ddf1d0f845cdd549ca` — `fix: lazily initialize native recorder backend`.\n- This revision contains the final application code from the storage-boundary, external-export, batch-service/UI, and lazy-recorder continuation.\n- Windows run `31870087266`: **SUCCESS**.\n- Apple run `31870087249`: **SUCCESS** for macOS debug and unsigned-iOS debug.\n- Linux Package CI run `31870087317`: **SUCCESS** for the maintained Debian package pipeline.\n\nFinal source/test revision:\n\n- `e47b290a7255f126cfcf1436444a90cc32d10823` — `test: isolate stopped-recording persistence rollback scenario`.\n- Its additional change is a test-fixture correction; it does not alter application code.\n- Core Flutter CI run `31870224720`: static analysis **SUCCESS**, complete **87/87** test suite **SUCCESS**, Android debug **SUCCESS**, Linux debug **SUCCESS**.\n\n### Formatter boundary intentionally not overclaimed\n\nThe core CI job runs `dart format` before analysis/tests and reported `Formatted 54 files (30 changed)`. Therefore:\n\n- analyzer/tests/build behavior is green on the formatter-normalized checkout;\n- the committed Dart tree is **not** claimed formatter-clean;\n- `TODO.md` now explicitly tracks committing the formatter output for the CI toolchain;\n- after that source cleanup is committed, CI should become a non-mutating formatting enforcement gate rather than silently correcting drift before validation.\n\nThis is the remaining repository-only hygiene item identified in this continuation. It is intentionally not hidden by the otherwise green validation result.\n\n### Release/evidence boundary\n\nThe project remains a **development preview**. Still-open work is evidence-dependent: physical microphone permission/routing, background/lock-screen/interruption behavior, real low-storage/permission/process/power-loss recovery, playable/partially-written/damaged real-media recovery, malformed-media corpus testing, large-library/large-batch/long-duration profiling, screen-reader/accessibility audits, native-brand visual review, representative Debian/Ubuntu install/audio/upgrade/desktop evidence, real screenshots, Windows signing decision, Android/Apple signing/notarization, and final stable release approval.\n\nDo not convert those unchecked gates to completed status from hosted unit/build evidence alone.\n\n### Exact continuation point\n\nDo not reimplement the managed-path boundary, active/Trash orphan reconstruction, entity-aware collision rules, batch execution service, lazy recorder construction, Linux GitHub Releases policy, or diagnostic localization policy in the next continuation. The next repository-only task is the formatter-cleanup/enforcement item in `TODO.md`. After that, remaining work is primarily real-system evidence and maintainer-owned signing/release work unless a new reproducible repository defect is found.\n'''
          p.write_text(s)
          PY
          git add what_changed.md
          git commit -m "docs: append storage batch and release continuation ledger"
      - name: Remove one-shot helper and push
        shell: bash
        run: |
          git rm .github/workflows/zz-continuation-ledger-sync.yml
          git commit -m "chore: remove one-shot continuation ledger sync"
          git push origin HEAD:main
      - name: Dispatch clean-tree repository audit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          curl --fail-with-body -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/repository-audit.yml/dispatches" \
            -d '{"ref":"main"}'
