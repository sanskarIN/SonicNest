name: Repository Integrity Audit

on:
  push:
    branches: [main]
    paths:
      - 'tool/repository_audit.py'
      - 'pubspec.yaml'
      - '.gitignore'
      - 'LICENSE'
      - 'NOTICE'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'PRIVACY.md'
      - 'SECURITY.md'
      - 'SUPPORT.md'
      - 'ROADMAP.md'
      - 'PROJECT_STATE.md'
      - 'TODO.md'
      - 'what_changed.md'
      - 'docs/**'
      - '.github/workflows/**'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    branches: [main]
    paths:
      - 'tool/repository_audit.py'
      - 'pubspec.yaml'
      - '.gitignore'
      - 'LICENSE'
      - 'NOTICE'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'PRIVACY.md'
      - 'SECURITY.md'
      - 'SUPPORT.md'
      - 'ROADMAP.md'
      - 'PROJECT_STATE.md'
      - 'TODO.md'
      - 'what_changed.md'
      - 'docs/**'
      - '.github/workflows/**'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sonicnest-repository-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Repository invariants
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Compile audit script
        run: python3 -m py_compile tool/repository_audit.py
      - name: Run repository integrity audit
        run: python3 tool/repository_audit.py
      - name: Validate Bash helper syntax
        run: |
          set -euo pipefail
          find tool -maxdepth 1 -type f -name '*.sh' -print0 \
            | sort -z \
            | while IFS= read -r -d '' script; do
                echo "Parsing $script"
                bash -n "$script"
              done
      - name: Validate PowerShell helper syntax
        shell: pwsh
        run: |
          $Failed = $false
          Get-ChildItem -Path tool -Filter '*.ps1' -File | Sort-Object FullName | ForEach-Object {
            $Tokens = $null
            $Errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$Tokens,
              [ref]$Errors
            ) | Out-Null
            if ($Errors.Count -gt 0) {
              Write-Error "PowerShell parse errors in $($_.FullName)"
              $Errors | ForEach-Object { Write-Error $_.Message }
              $Failed = $true
            }
          }
          if ($Failed) { exit 1 }
