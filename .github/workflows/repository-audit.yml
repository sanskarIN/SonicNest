name: Repository Integrity Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sonicnest-repository-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Repository invariants
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Compile Python helpers
        run: |
          set -euo pipefail
          find tool -type f -name '*.py' -print0 \
            | sort -z \
            | xargs -0 -r python3 -m py_compile
      - name: Run repository integrity audit
        run: python3 tool/repository_audit.py
      - name: Audit every tracked text/source line
        run: python3 tool/source_line_audit.py
      - name: Run Python tooling regression tests
        run: python3 -m unittest discover -s tool/tests -p 'test_*.py' -v
      - name: Validate Bash helper syntax
        run: |
          set -euo pipefail
          find tool -maxdepth 1 -type f -name '*.sh' -print0 \
            | sort -z \
            | while IFS= read -r -d '' script; do
                echo "Parsing $script"
                bash -n "$script"
              done
      - name: Validate PowerShell helper syntax
        shell: pwsh
        run: |
          $Failed = $false
          Get-ChildItem -Path tool -Filter '*.ps1' -File | Sort-Object FullName | ForEach-Object {
            $Tokens = $null
            $Errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$Tokens,
              [ref]$Errors
            ) | Out-Null
            if ($Errors.Count -gt 0) {
              Write-Error "PowerShell parse errors in $($_.FullName)"
              $Errors | ForEach-Object { Write-Error $_.Message }
              $Failed = $true
            }
          }
          if ($Failed) { exit 1 }
