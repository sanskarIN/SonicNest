name: Temporary reliability ledger sync

on:
  push:
    branches: [main]
    paths:
      - 'docs/RELIABILITY_HARDENING_2026-08-18.md'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Append continuation state without replacing history
        shell: bash
        run: |
          set -euo pipefail

          marker='# Continuation — 2026-08-18 — Filename, settings snapshot, import cleanup, and generated-path hardening'
          if ! grep -Fq "$marker" what_changed.md; then
            cat >> what_changed.md <<'EOF'

# Continuation — 2026-08-18 — Filename, settings snapshot, import cleanup, and generated-path hardening

## Objective

Continue repository-owned reliability work after the broader release automation was already complete, without falsely closing any physical-device, accessibility, stress, protected-signing, store-console, or stable-release gate.

## Cross-platform filename hardening

- Recording filename fallbacks now pass through the same sanitization rules as user/template names.
- Windows device names are protected even when followed by suffix text such as `CON.notes`, `COM1.session`, or `LPT9.archive`.
- Long names are truncated by Unicode code point instead of UTF-16 position so non-BMP text is not split into invalid surrogate fragments.
- Filename stems are bounded to 120 Unicode code points and 220 UTF-8 bytes, leaving headroom for extensions and collision suffixes on common filesystems.
- Regression coverage includes unsafe characters, reserved names, reserved-name suffixes, malformed fallbacks, long ASCII, long Unicode, UTF-8 byte bounds, and preserved multilingual names.

## Coherent settings persistence

- `SettingsService` now writes one versioned JSON snapshot under `settings_snapshot_v1` instead of independently writing seven preference keys.
- The canonical snapshot binds recording settings, theme, playback speed, jump interval, skip-silence, delete confirmation, and reduced-motion state into one persistence result.
- Existing per-field keys remain readable as a migration/corruption fallback so installed users do not lose prior preferences.
- A valid canonical snapshot takes precedence over stale legacy keys.
- A damaged canonical snapshot falls back to legacy preferences instead of fabricating values.
- Unsupported or malformed stored values continue to use the established safe-default validation rules.
- Regression coverage verifies roundtrip behavior, canonical precedence, legacy fallback, corruption fallback, and the absence of new legacy writes.

## Import cleanup failure isolation

- `AudioImportService` now preserves its structured `AudioImportException` boundary when media validation fails and cleanup of the copied managed file also fails.
- Cleanup failure is reported as additional diagnostic detail instead of escaping as an unrelated filesystem exception that could abort the surrounding multi-file import batch unexpectedly.
- A deterministic regression injects both the primary media-probe failure and a cleanup failure and verifies the original source path and both failure details remain represented.

## Generated path extension boundary

- `StorageService` now validates generated file-extension text before joining it into a managed recording, Trash, or temporary output path.
- A leading dot is normalized away, safe alphanumeric extensions are lowercased, and invalid/separator/traversal-shaped extension strings are rejected with `FormatException`.
- Regression coverage rejects values such as `../wav`, `txt/../../outside`, and an empty extension while verifying `.PCM` normalizes to `.pcm` inside the requested managed directory.

## Formatter gate finding and correction

The first pull-request validation correctly caught committed Dart-format drift in five continuation-touched files. The failure was not ignored or weakened.

- Repository Integrity Audit on the initial path-hardening PR source succeeded.
- The initial Flutter CI formatter gate failed before analyzer/tests because hosted Flutter stable reported five files needing canonical formatting.
- Linux debug compilation from that initial run completed successfully before concurrency replacement.
- A temporary formatter-diff diagnostic was used only on the validation branch and was then fully reverted.
- Canonical formatter-only corrections were committed in focused commits.
- The permanent non-mutating formatter command was restored byte-for-byte; the final PR diff contains no workflow change.
- The final restored-head workflow matrix was queued at merge time, so it is intentionally not recorded as successful without completion evidence.

