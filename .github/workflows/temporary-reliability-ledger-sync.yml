Still intentionally open: physical microphone permissions/capture/routing, wired/USB/Bluetooth behavior, interruption/background/lock-screen/media-button behavior, real low-storage/permission/process/power-loss recovery, representative malformed/partial/damaged media, large-library and long-duration performance, accessibility audits, real native visual review/screenshots, representative Linux/Windows package QA, Android/Apple/Windows protected signing, notarization/store-console validation, and final stable-release approval.

Do not mark those gates complete from this repository-only hardening work.
EOF
          fi

