name: One-shot Web reliability ledger sync

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-web-reliability-ledger.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Append continuation records and self-remove
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Sanskar'
          git config user.email 'sanskarin@outlook.in'

          if ! grep -Fq 'Web stream completion and playback reliability — 2026-08-23' CHANGELOG.md; then
            cat >> CHANGELOG.md <<'EOF'

## Web stream completion and playback reliability — 2026-08-23

- Unexpected clean browser capture-stream completion now uses the same fail-closed recovery boundary as an explicit stream error; incomplete PCM is discarded and recorder/timer/amplitude state returns to a restartable stopped state.
- Capture-generation invalidation prevents late stream errors/completion callbacks from overwriting normal Stop, Cancel, or dispose transitions.
- Microphone refresh, device/channel choice, automatic gain, echo cancellation, and noise suppression are locked while recorder transitions are busy as well as while capture is active.
- Paused playback of the same in-session recording now resumes the loaded source/position rather than reloading from the beginning; playback futures are observed and stale playing-row state is cleared on failure.
- Web platform source-contract tests and browser QA/support documentation were expanded for these behaviors.
- These source changes do not close representative-browser, accessibility, hosting, signing, or stable-release gates; SonicNest remains a development preview.
EOF
            git add CHANGELOG.md
            git commit -m 'docs(web): record 2026-08-23 reliability changelog'
          fi

          if ! grep -Fq 'Web reliability hardening — 2026-08-23' PROJECT_STATE.md; then
            cat >> PROJECT_STATE.md <<'EOF'

## Web reliability hardening — 2026-08-23

- Unexpected clean capture-stream completion now enters the shared fail-closed recovery path instead of leaving recording UI state active after browser audio delivery ends.
- Capture-generation invalidation makes late errors/completion callbacks stale after Stop, Cancel, or disposal.
- Browser microphone/device/channel/DSP controls share a busy-or-active transition lock.
- Same-recording playback pause/resume preserves the loaded source and position; playback failures clear stale playing-row state.
- `tool/tests/test_web_platform_contract.py` locks stream-completion recovery, transition input locking, playback resume, and awaited playback.
- Manual browser/device/accessibility/stress/hosting/signing evidence remains required; no fresh six-platform release-candidate result is inferred from source review.
- Release classification remains **development preview**.
EOF
            git add PROJECT_STATE.md
            git commit -m 'docs(web): sync project state with Web reliability hardening'
          fi

          if ! grep -Fq '# Continuation — 2026-08-23 — Web stream completion, transition locking, and playback recovery' what_changed.md; then
            cat >> what_changed.md <<'EOF'

# Continuation — 2026-08-23 — Web stream completion, transition locking, and playback recovery

## Objective

Continue repository-owned Web reliability hardening after the 2026-08-20 capture-error and PCM-timing work. Review found three deterministic gaps: unexpected clean capture-stream completion had no `onDone` recovery path, input settings remained editable while recorder transitions were busy, and same-recording playback pause/resume reloaded its source while playback failures were launched through an unobserved future.

## Implemented

- `lib/main_web.dart` now routes unexpected capture-stream `onDone` through `_recoverFromCaptureFailure(...)`.
- Current-generation unexpected completion invalidates capture, cancels timer/subscriptions, discards partial PCM, resets elapsed/amplitude/record state, and returns the UI to a restartable stop state.
- Stop/Cancel already invalidate the capture generation before backend termination, so their expected completion callbacks are stale and cannot race the requested state. Disposal preserves the same rule.
- Added `_canChangeInputSettings => !_busy && !_hasActiveCapture` and applied it to microphone refresh/selection, mono/stereo selection, automatic gain, echo cancellation, and noise suppression.
- Same-recording Web playback now pauses/resumes the already-loaded source instead of reloading it from zero.
- Playback start/resume is awaited; asynchronous failures clear stale `_playingId` state and use the existing recoverable user message.

## Regression protection

`tool/tests/test_web_platform_contract.py` now requires:

- capture-stream `onDone` fail-closed recovery;
- the busy/active input-settings lock;
- same-recording playback resume behavior;
- awaited playback and absence of the old `unawaited(_player.play())` path.

Focused commits:

- `db6203bb2b95b44095fca5709bedc71163029fdb` — `fix(web): harden stream completion and playback state`;
- `88115e11f7bfcb1cd007ac4e09977b90e1604378` — `test(web): lock stream completion and playback recovery`;
- `536684637b6adf2725e801957cd90df153e50523` — `docs(web): record stream completion reliability hardening`;
- `4c4f30df584a8e9b96dd6269d1bc4a7f68af0912` — `docs(web): expand stream completion and playback QA gates`;
- `1355b86a35781de82c1d4094fe61d6652c533367` — `docs(web): document clean stream and playback recovery`.

## Documentation and QA boundary

- Added `docs/WEB_RELIABILITY_HARDENING_2026-08-23.md`.
- `docs/WEB_SUPPORT.md` now documents clean-stream recovery, transition locking, same-source resume, and observed playback failures.
- `docs/WEB_QA_CHECKLIST.md` now requires real-browser evidence for clean stream termination, stale completion callbacks during Stop/Cancel, settings locking during transitions, playback resume, and playback-failure state recovery.

No fresh hosted Flutter CI, Repository Integrity Audit, six-platform Release Candidate Validation, physical microphone test, representative Chromium/Firefox/Safari/WebKit test, accessibility audit, production HTTPS/cache/security review, or protected signing result is claimed merely from this repository continuation. `TODO.md` remains authoritative for those unchecked evidence gates, and SonicNest remains a **development preview**.

## Exact continuation point

Do not reimplement the 2026-08-20 PCM frame/duration and capture-error generation work or this 2026-08-23 clean-completion, transition-locking, and playback-resume hardening. Next work should consume fresh permanent workflow evidence when available and fix only reproducible failures; remaining browser/device/accessibility/stress/hosting/signing work must be closed with real evidence rather than source review alone.
EOF
            git add what_changed.md
            git commit -m 'docs: append 2026-08-23 Web reliability continuation'
          fi

          rm -f .github/workflows/one-shot-web-reliability-ledger.yml
          git add -A .github/workflows/one-shot-web-reliability-ledger.yml
          git commit -m 'chore: remove one-shot Web reliability ledger sync'
          git push origin HEAD:main
