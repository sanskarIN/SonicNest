name: Temporary project state synchronization

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/project-state-sync-temp.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Synchronize large state files safely
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          state_path = Path('PROJECT_STATE.md')
          state = state_path.read_text(encoding='utf-8')
          replacements = {
              '  import_export: file_picker 10.3.10 + share_plus 12.0.2\n':
                  '  import_export: file_picker 12.0.0-beta.7 + share_plus 13.3.0\n',
              '  screen_wake: wakelock_plus 1.4.0\n':
                  '  screen_wake: wakelock_plus 1.7.0\n',
          }
          for old, new in replacements.items():
              count = state.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one PROJECT_STATE occurrence for {old!r}; found {count}')
              state = state.replace(old, new, 1)

          feature = '  - deterministic dependency-state summary verification against pubspec.yaml\n'
          anchor = '  - Windows stable public signing policy requires Authenticode while actual signing credentials/service remain maintainer-owned\n'
          if feature not in state:
              if state.count(anchor) != 1:
                  raise SystemExit('Could not locate completed_features insertion anchor')
              state = state.replace(anchor, anchor + feature, 1)

          state_path.write_text(state, encoding='utf-8')
          PY

          git config user.name 'Sanskar'
          git config user.email 'sanskarin@outlook.in'
          git add PROJECT_STATE.md
          git diff --cached --check
          git commit -m 'docs: sync project state dependency versions'

          python3 - <<'PY'
          from pathlib import Path

          path = Path('what_changed.md')
          text = path.read_text(encoding='utf-8')
          marker = '# Continuation — 2026-08-19 — Release readiness and dependency-state integrity'
          if marker not in text:
              addition = r'''


# Continuation — 2026-08-19 — Release readiness and dependency-state integrity

## Release-readiness bookkeeping

The repository now has deterministic release-readiness bookkeeping that keeps the external stable-release gates visible without claiming they were performed.

- `tool/build_release_readiness_report.py` parses canonical `TODO.md` checklist sections and emits deterministic JSON plus optional Markdown.
- `tool/verify_release_readiness_report.py` independently validates schema, summary/section reconciliation, pending-item integrity, and conservative stable-release approval.
- The permanent Repository Integrity Audit builds and verifies a fresh snapshot from the real `TODO.md`.
- Parser, CLI, malformed-checklist, and independent-verifier regressions are covered under `tool/tests/`.
- Stable approval remains false while physical-device, accessibility, stress, signing, distribution-console, translation-review, or final-release evidence remains incomplete.

Focused release-readiness commits immediately preceding this continuation include `047d213c0419ce0fecf734d0fde4bf8ebb839e1b`, `6fccd28b67d5758adc23909df62ac978bbd1408c`, `7fa2a7e870e92db50ebd65d519929046d11f4747`, `352ece77512cb16e57dcb925787713f3f182572f`, `8719fbd7f3ee1e58b6712bdeb957789246d7857c`, `28913099167da50629efb5284dacd8d01eead9d9`, `d82fa593d2c39f5caad3347ec38c4ad2377ca970`, `8e2b2cc502c018c7fd5f849a62a45ac16687e168`, `dabf7621934d633a694bb69a09b58eda26342325`, `fd90389d96ccbc47402d2329ce4069c7eb277e8d`, `731815cc2749b8b6191f6104081c264f3e3c25b5`, and `dd77a61c1f3b8d93e72bece635a92f96b05e0cd3`.

## Dependency-state drift fixed

A follow-up audit found that `PROJECT_STATE.md` still described the older import/export and screen-wake dependency line even though `pubspec.yaml` had already moved to the validated compatibility graph.

The project-state summary is synchronized to:

- `file_picker 12.0.0-beta.7`;
- `share_plus 13.3.0`;
- `wakelock_plus 1.7.0`.

The existing recorder, player, and FFmpeg summary remains aligned with the direct runtime constraints.

Added `tool/verify_project_state_dependencies.py` so this human-readable summary can no longer silently drift from the protected direct dependency constraints in `pubspec.yaml`. The verifier is standard-library-only, conservative about unsupported compound/nested constraints, and reports exact stale stack entries.

Added `tool/tests/test_verify_project_state_dependencies.py` covering matching state, stale import/export and screen-wake versions, missing/nested dependencies, compound constraints, missing stack structure, and CLI success/failure behavior.

Added `docs/DEPENDENCY_STATE.md` to document the canonical source, protected relationships, current compatibility line, and validation boundary.

## Evidence boundary

This continuation improves repository truthfulness and deterministic release bookkeeping. It does not close any unchecked real-device microphone/routing/lifecycle, low-storage/power/process interruption, representative-media, accessibility, long-duration/performance, visual-branding, protected signing/notarization, distribution-console, translation-review, or final `v1.0.0` gate.
'''
              path.write_text(text.rstrip() + addition + '\n', encoding='utf-8')
          PY

          git add what_changed.md
          git diff --cached --check
          git commit -m 'docs: record dependency state integrity continuation'
          git push origin HEAD:main
