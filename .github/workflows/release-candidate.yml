name: Release Candidate Validation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sonicnest-release-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Source preflight
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Linux audio prerequisites
        run: sudo apt-get update && sudo apt-get install -y ffmpeg pulseaudio-utils libjson-glib-dev
      - name: Run release-candidate preflight
        run: bash tool/release_preflight.sh

  android:
    name: Android release-mode artifacts
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: bash tool/bootstrap_platforms.sh
      - run: flutter pub get
      - run: bash tool/apply_branding.sh
      - name: Build release-mode APK and AAB
        run: |
          flutter build apk --release
          flutter build appbundle --release
      - name: Prepare checksums and warning
        run: |
          mkdir -p build/release-candidate/android
          cp build/app/outputs/flutter-apk/app-release.apk build/release-candidate/android/sonicnest-android-release-unsigned.apk
          cp build/app/outputs/bundle/release/app-release.aab build/release-candidate/android/sonicnest-android-release-unsigned.aab
          cat > build/release-candidate/android/RELEASE_CANDIDATE_WARNING.txt <<'TXT'
          SonicNest release-candidate validation artifact.
          This output is not approved for public/store distribution.
          It has not passed the repository's physical-device, accessibility, signing, store, and final visual-QA gates.
          Maintainer-owned production signing credentials are intentionally not stored in this repository.
          TXT
          cd build/release-candidate/android
          sha256sum sonicnest-android-release-unsigned.apk sonicnest-android-release-unsigned.aab > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: sonicnest-android-release-candidate
          path: build/release-candidate/android
          if-no-files-found: error
          retention-days: 7

  linux:
    name: Linux release-mode artifacts
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Linux build and package dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            ffmpeg pulseaudio-utils libjson-glib-dev \
            desktop-file-utils appstream
      - run: flutter config --enable-linux-desktop
      - run: bash tool/bootstrap_platforms.sh
      - run: flutter pub get
      - run: dart tool/generate_brand_assets_v2.dart
      - run: flutter build linux --release
      - name: Build and verify Debian package
        run: |
          bash tool/build_linux_deb.sh release
          bash tool/verify_linux_deb.sh
      - name: Package release-mode artifacts
        run: |
          set -euo pipefail
          OUT=build/release-candidate/linux
          mkdir -p "$OUT"
          tar -C build/linux/x64/release -czf "$OUT/sonicnest-linux-release-unsigned.tar.gz" bundle
          DEB="$(find build/linux-package -maxdepth 1 -type f -name 'sonicnest_*.deb' -print -quit)"
          test -n "$DEB"
          cp "$DEB" "$OUT/"
          cat > "$OUT/RELEASE_CANDIDATE_WARNING.txt" <<'TXT'
          SonicNest release-candidate validation artifacts.
          Debian .deb is the selected initial Linux installation format and this package has passed repository structural validation.
          These artifacts are still not approved for public distribution until real-machine audio, accessibility, long-duration, low-storage, final visual, and release-policy gates are complete.
          TXT
          (cd "$OUT" && sha256sum sonicnest-linux-release-unsigned.tar.gz sonicnest_*.deb > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: sonicnest-linux-release-candidate
          path: build/release-candidate/linux
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Windows release-mode artifact
    needs: preflight
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter config --enable-windows-desktop
      - shell: pwsh
        run: ./tool/bootstrap_platforms.ps1
      - run: flutter pub get
      - shell: pwsh
        run: ./tool/apply_branding.ps1
      - run: flutter build windows --release
      - name: Build Windows portable package
        shell: pwsh
        run: ./tool/build_windows_portable.ps1 -Configuration release -ArtifactSuffix unsigned -OutputDirectory 'build\release-candidate\windows'
      - name: Verify Windows portable package
        shell: pwsh
        run: |
          $Archive = Get-ChildItem 'build\release-candidate\windows' -Filter 'sonicnest-windows-*.zip' -File | Select-Object -First 1
          if (-not $Archive) { throw 'Windows release-candidate package was not created.' }
          ./tool/verify_windows_portable.ps1 -ArchivePath $Archive.FullName
      - name: Smoke-test Windows portable startup
        shell: pwsh
        run: |
          $Archive = Get-ChildItem 'build\release-candidate\windows' -Filter 'sonicnest-windows-*.zip' -File | Select-Object -First 1
          if (-not $Archive) { throw 'Windows release-candidate package was not created.' }
          ./tool/smoke_test_windows_portable.ps1 -ArchivePath $Archive.FullName -StartupSeconds 8
      - name: Add release-candidate warning
        shell: pwsh
        run: |
          @'
          SonicNest release-candidate validation artifact.
          This portable Windows archive is unsigned and is not approved for public distribution.
          Hosted startup smoke only confirms that the extracted release executable remained alive during a bounded launch check; it does not validate microphone, audio routing, accessibility, real desktop branding, or Authenticode trust.
          Authenticode, real-machine microphone/routing, accessibility, final visual review, and release-evidence gates remain incomplete.
          '@ | Set-Content -Path 'build\release-candidate\windows\RELEASE_CANDIDATE_WARNING.txt' -Encoding UTF8
      - uses: actions/upload-artifact@v4
        with:
          name: sonicnest-windows-release-candidate
          path: build/release-candidate/windows
          if-no-files-found: error
          retention-days: 7

  macos:
    name: macOS release-mode artifact
    needs: preflight
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter config --enable-macos-desktop
      - run: bash tool/bootstrap_platforms.sh
      - run: flutter pub get
      - run: bash tool/apply_branding.sh
      - run: flutter build macos --release
      - name: Package release-mode app
        run: |
          set -euo pipefail
          OUT=build/release-candidate/macos
          mkdir -p "$OUT"
          APP_PATH="$(find build/macos/Build/Products/Release -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$OUT/sonicnest-macos-release-unsigned.zip"
          cat > "$OUT/RELEASE_CANDIDATE_WARNING.txt" <<'TXT'
          SonicNest release-candidate validation artifact.
          This macOS application archive is not notarized/signed for public distribution.
          Real-hardware QA, Apple signing, notarization, accessibility, and final visual review remain release gates.
          TXT
          (cd "$OUT" && shasum -a 256 sonicnest-macos-release-unsigned.zip > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: sonicnest-macos-release-candidate
          path: build/release-candidate/macos
          if-no-files-found: error
          retention-days: 7

  ios:
    name: iOS no-codesign release-mode artifact
    needs: preflight
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: bash tool/bootstrap_platforms.sh
      - run: flutter pub get
      - run: bash tool/apply_branding.sh
      - run: flutter build ios --release --no-codesign
      - name: Package no-codesign app bundle
        run: |
          set -euo pipefail
          OUT=build/release-candidate/ios
          mkdir -p "$OUT"
          APP_PATH="$(find build/ios/iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$OUT/sonicnest-ios-release-unsigned.zip"
          cat > "$OUT/RELEASE_CANDIDATE_WARNING.txt" <<'TXT'
          SonicNest release-candidate validation artifact.
          This iOS application bundle is not codesigned and is not an installable App Store package.
          Provisioning, signing, real-device QA, accessibility, store metadata, and final visual review remain release gates.
          TXT
          (cd "$OUT" && shasum -a 256 sonicnest-ios-release-unsigned.zip > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: sonicnest-ios-release-candidate
          path: build/release-candidate/ios
          if-no-files-found: error
          retention-days: 7
