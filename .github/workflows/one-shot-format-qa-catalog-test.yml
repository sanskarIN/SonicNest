name: One-shot QA catalog formatter

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-format-qa-catalog-test.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Configure commit identity
        run: |
          git config user.name "Sanskar"
          git config user.email "sanskarin@outlook.in"
      - name: Apply exact permanent-gate formatting scope
        run: dart format lib test tool/generate_brand_assets_v2.dart
      - name: Record formatter changes
        shell: bash
        run: |
          git diff --name-only -- lib test tool/generate_brand_assets_v2.dart > .github/manual-qa-format-result.txt
          if [[ ! -s .github/manual-qa-format-result.txt ]]; then
            printf '%s\n' 'NO_FORMAT_CHANGES' > .github/manual-qa-format-result.txt
          fi
      - name: Commit each formatted source file
        shell: bash
        run: |
          while IFS= read -r file; do
            [[ -z "$file" || "$file" == "NO_FORMAT_CHANGES" ]] && continue
            git add -- "$file"
            git commit -m "style: apply canonical Dart formatting to $file"
          done < .github/manual-qa-format-result.txt
      - name: Commit formatter result
        run: |
          git add .github/manual-qa-format-result.txt
          git commit -m "ci: record manual QA formatter result"
      - name: Push canonical formatting
        run: git push origin HEAD:main
