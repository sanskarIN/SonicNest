name: One-shot Dart format cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/zz-format-cleanup.yml'

permissions:
  contents: write

jobs:
  format-source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Configure commit identity
        run: |
          git config user.name "Sanskar"
          git config user.email "sanskarin@outlook.in"
      - name: Resolve dependencies for formatter context
        run: flutter pub get
      - name: Commit canonical Dart formatting
        shell: bash
        run: |
          dart format lib test tool/generate_brand_assets_v2.dart
          if ! git diff --quiet -- lib test tool/generate_brand_assets_v2.dart; then
            git add lib test tool/generate_brand_assets_v2.dart
            git commit -m "style: commit canonical Dart formatting"
          fi
      - name: Remove helper and push formatter-clean source
        shell: bash
        run: |
          git rm .github/workflows/zz-format-cleanup.yml
          git commit -m "chore: remove one-shot Dart format cleanup"
          git push origin HEAD:main
