name: One-shot continuation log sync

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/continuation-log-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Append latest continuation if missing
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('what_changed.md')
          text = p.read_text(encoding='utf-8')
          marker = '# Batch export destination and safe cancellation continuation'
          if marker not in text:
              text += r'''

---

# Batch export destination and safe cancellation continuation

This section records the next repository-implementable batch workflow improvements. Earlier continuation history remains unchanged above.

## User-selected external export folder

`ExternalActions` now exposes directory selection through the pinned `file_picker` platform API. `BatchConvertScreen` can optionally copy each successfully converted managed-library output into a user-selected external folder.

The external copy happens **after** the managed conversion and library registration succeeds. If the external copy fails, the valid SonicNest library output is retained rather than rolled back.

External-copy behavior includes:

- optional destination-folder selection
- destination path displayed in the batch UI
- change-folder action before processing
- collision-safe copies using `name.ext`, `name (2).ext`, `name (3).ext`, and so on
- source existence validation before copying
- destination-directory existence validation before copying
- separate conversion-failure and export-copy-failure reporting
- no overwrite of existing destination files

Focused commit:

- `feat: add user-selected export directory support`

## Safe between-file cancellation

Batch conversion now supports **Stop after current file** instead of attempting to terminate an FFmpeg operation in the middle of a write. This keeps completed files transactionally understandable and avoids deliberately creating partial output files.

Cancellation semantics:

- cancellation request is recorded while the current item is processing
- the current conversion is allowed to complete or fail normally
- the next selected item is not started after cancellation is observed
- already completed library outputs remain registered
- already completed external copies remain intact
- the final status reports how many selected items were processed before stopping

Focused commit:

- `feat: add batch export folder and safe cancellation`

## Validation status for this newest source

These source changes trigger the existing source/build workflows because they modify `lib/**`. This log does not invent a success result: use the newest GitHub Actions runs for the exact source revision before promoting it beyond development-preview status.

The last fully observed cross-platform green source revision before these two changes remains `985f2dd1500a03b0b65ee58b142cf31f545b0cc5`, documented above. The export-folder/cancellation source is newer and must be treated as pending exact workflow verification until its analyzer/test/Android/Linux/Windows/macOS/unsigned-iOS results are observed.

## Remaining manual checks specific to this continuation

- directory picker behavior on Android, iOS, macOS, Windows, and Linux
- destination access revocation/disappearance between selection and copy
- filename collision behavior in real user folders
- low-storage behavior during managed conversion and external copy
- very large batch behavior
- stop-after-current behavior on long-running conversions
- user closing/navigating away from the batch screen during processing

Do not mark these physical/filesystem interaction checks complete without evidence.
'''
              p.write_text(text, encoding='utf-8')
          PY
      - name: Remove one-shot workflow
        run: git rm .github/workflows/continuation-log-sync.yml
      - name: Commit synchronized continuation log
        shell: bash
        run: |
          git config user.name 'Sanskar'
          git config user.email 'sanskarin@outlook.in'
          if ! git diff --quiet; then
