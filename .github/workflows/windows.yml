name: Windows Build

on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'windows/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'tool/**'
      - '.github/workflows/windows.yml'
  pull_request:
    branches: [main]
    paths:
      - 'lib/**'
      - 'windows/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'tool/**'
      - '.github/workflows/windows.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sonicnest-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows debug build
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop
      - name: Generate platform hosts
        shell: pwsh
        run: ./tool/bootstrap_platforms.ps1
      - name: Resolve dependencies
        run: flutter pub get
      - name: Apply SonicNest native branding
        shell: pwsh
        run: ./tool/apply_branding.ps1
      - name: Build Windows debug application
        run: flutter build windows --debug
