name: Release Format Capture

on:
  push:
    branches: [release/2.18.12-prep]
    paths:
      - .github/workflows/release-format-capture.yml
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/release-format-capture.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    name: Capture canonical Dart format patch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Apply canonical Dart formatting
        run: dart format lib test tool/generate_brand_assets_v2.dart
      - name: Capture formatter patch
        run: |
          set -euo pipefail
          git diff --binary > dart-format.patch
          test -s dart-format.patch
      - name: Upload formatter patch
        uses: actions/upload-artifact@v7
        with:
          name: sonicnest-release-format-patch
          path: dart-format.patch
          if-no-files-found: error
          retention-days: 1
