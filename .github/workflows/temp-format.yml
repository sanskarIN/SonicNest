name: Temporary Dart Formatter

on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'test/**'
      - '.github/workflows/temp-format.yml'

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Apply canonical Dart formatting
        run: dart format lib test tool/generate_brand_assets_v2.dart
      - name: Commit formatter output when needed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib test tool/generate_brand_assets_v2.dart
          if git diff --cached --quiet; then
            echo 'No formatter changes required.'
            exit 0
          fi
          git commit -m 'style: apply canonical Dart formatting'
          git pull --rebase origin main
          git push origin HEAD:main
