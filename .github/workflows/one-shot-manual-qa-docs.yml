name: One-shot manual QA ledger sync

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-manual-qa-docs.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure commit identity
        run: |
          git config user.name "Sanskar"
          git config user.email "sanskarin@outlook.in"
      - name: Update manual QA documentation and ledgers
        run: python3 .github/scripts/one_shot_update_manual_qa_docs.py
      - name: Commit documentation separately
        shell: bash
        run: |
          files=(
            docs/QA_CHECKLIST.md
            docs/RELEASING.md
            docs/DIAGNOSTICS_AND_QA.md
            CHANGELOG.md
            RELEASE_NOTES.md
            PROJECT_STATE.md
            what_changed.md
          )
          for file in "${files[@]}"; do
            if ! git diff --quiet -- "$file"; then
              git add -- "$file"
              case "$file" in
                docs/QA_CHECKLIST.md) msg="docs: add in-app manual evidence to QA checklist" ;;
                docs/RELEASING.md) msg="docs: add manual evidence ledger to release procedure" ;;
                docs/DIAGNOSTICS_AND_QA.md) msg="docs: document diagnostics snapshot attachment flow" ;;
                CHANGELOG.md) msg="docs: record manual QA evidence in changelog" ;;
                RELEASE_NOTES.md) msg="docs: add manual QA evidence release notes" ;;
                PROJECT_STATE.md) msg="docs: synchronize manual QA project state" ;;
                what_changed.md) msg="docs: append manual QA continuation ledger" ;;
              esac
              git commit -m "$msg"
            fi
          done
      - name: Rebase and push ledger commits
        run: |
          git pull --rebase origin main
          git push origin HEAD:main
