name: One-shot Provenance Ledger Sync

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/zz-provenance-ledger-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure commit identity
        run: |
          git config user.name "Sanskar"
          git config user.email "sanskarin@outlook.in"
      - name: Update changelog
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('CHANGELOG.md')
          text = p.read_text(encoding='utf-8')
          added = "- Unified machine-readable release-candidate provenance manifest builder and final hosted aggregation job that re-verifies all five platform payload checksum records and binds them to the exact source SHA, application version, workflow run, and attempt.\n- Python regression coverage for release provenance tooling plus permanent repository-audit execution of the Python release-tool suite.\n"
          changed = "- Release-candidate validation now publishes a separate checksummed `sonicnest-release-candidate-manifest` artifact only after Android, Linux, Windows, macOS, and iOS candidate jobs succeed.\n- Repository release evidence now preserves the unified manifest hash, platform payload hashes, workflow artifact digests, signing classifications, and explicit `stableReleaseApproved: false` boundary.\n"
          validation = "- Provenance source revision `b95d77c4b69c9798f1ecb48d5f69583c4e08de5c` passed Release Candidate Validation run `31876035202`: source preflight, Android, Linux, Windows, macOS, iOS, and the unified provenance manifest job all succeeded.\n- The generated `RELEASE_CANDIDATE_MANIFEST.json` SHA-256 is `8a49759555cad26a60858025d82953ad0e3c3b429aa8138d67f7ef4f86d99b7e`; independent post-download recomputation matched it exactly. The manifest workflow artifact digest is `sha256:5fa654434ba304e7b67945250f7c8f4bec14eacbc87effefa5cd2d620885baa3`.\n- Repository Integrity Audit run `31876149473` passed Python compilation, repository invariants, all 10 Python release-tool tests, Bash syntax, and PowerShell syntax.\n"
          if added.strip() not in text:
              text = text.replace('### Added\n', '### Added\n' + added, 1)
          if changed.strip() not in text:
              text = text.replace('### Changed\n', '### Changed\n' + changed, 1)
          if validation.strip() not in text:
              text = text.replace('### Validation\n', '### Validation\n' + validation, 1)
          p.write_text(text, encoding='utf-8')
          PY
          git add CHANGELOG.md
          git commit -m "docs: record unified provenance release hardening"
      - name: Update release notes
        run: |
          cat >> RELEASE_NOTES.md <<'EOF'

## 2026-08-15 — Unified hosted release-candidate provenance

SonicNest now produces a machine-readable provenance record after all five hosted release-mode platform jobs succeed. `tool/build_release_candidate_manifest.py` downloads/re-verifies each platform candidate's checksum evidence, requires Android's explicit Debug-certificate / NON-PRODUCTION classification, records every evidence file's SHA-256 and size, and binds the result to the exact full Git source SHA, application version, GitHub Actions run, and run attempt.

The permanent Repository Integrity Audit compiles the Python release helpers and runs the release-tool regression suite. Run `31876149473` passed all **10/10** Python tests together with the repository invariant audit and Bash/PowerShell helper syntax checks.

Hosted Release Candidate Validation run `31876035202` on source `b95d77c4b69c9798f1ecb48d5f69583c4e08de5c` completed successfully for Source preflight, Android release-mode non-production APK/AAB, Linux release bundle + Debian package, Windows release portable ZIP + verification + extracted startup smoke, macOS release archive, iOS release no-codesign archive, and the final **Unified candidate provenance manifest** job.

The generated `RELEASE_CANDIDATE_MANIFEST.json` records application version `0.1.0+1`, release classification `development-preview`, and `stableReleaseApproved: false`. Its SHA-256 is `8a49759555cad26a60858025d82953ad0e3c3b429aa8138d67f7ef4f86d99b7e`; independent recomputation after downloading the artifact matched exactly. The manifest workflow artifact digest is `sha256:5fa654434ba304e7b67945250f7c8f4bec14eacbc87effefa5cd2d620885baa3`.

This evidence proves hosted checksum/source/run consistency only. It does not complete physical microphone/routing/interruption/background validation, real storage/process-failure testing, accessibility, sustained performance/soak tests, real visual review/screenshots, representative-system package QA, Android Play production signing, Apple provisioning/signing/notarization, Windows Authenticode, store acceptance, or final `v1.0.0` approval. SonicNest remains a **development preview**.
EOF
          git add RELEASE_NOTES.md
          git commit -m "docs: add unified provenance release notes"
      - name: Update QA checklist
        run: |
          cat >> docs/QA_CHECKLIST.md <<'EOF'

## Unified release-candidate provenance automation

Repository implementation/automation evidence:

- [x] `tool/build_release_candidate_manifest.py` requires Android, Linux, Windows, macOS, and iOS candidate evidence directories.
- [x] The manifest builder re-verifies platform release payloads against each artifact set's `SHA256SUMS.txt` and rejects malformed, missing, mismatched, path-escaping, or unchecksummed payload evidence.
