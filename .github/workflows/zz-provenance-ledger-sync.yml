## 2026-08-15 — Unified release-candidate provenance manifest continuation

This section is additive. All earlier SonicNest continuation history above remains preserved unchanged. This continuation did not alter recorder/runtime application behavior; it hardened repository-owned release evidence so a hosted cross-platform candidate can be tied to one exact source revision and its downloaded platform artifact bytes without overstating stable-release readiness.

### Machine-readable provenance builder

Added `tool/build_release_candidate_manifest.py` as a Python-standard-library-only release evidence tool.

The builder requires one candidate artifact directory for each maintained platform:

- Android
- Linux
- Windows
- macOS
- iOS

It requires each platform artifact directory to contain `RELEASE_CANDIDATE_WARNING.txt` and `SHA256SUMS.txt`. Android additionally requires `ANDROID_SIGNING_STATE.txt`.

The builder verifies and records:

- a full 40-character Git source SHA;
- positive GitHub Actions run ID and run attempt;
- application version from `pubspec.yaml`;
- every checksummed platform payload still exists;
- every checksummed payload's bytes match the recorded SHA-256;
- checksum entries cannot escape their platform evidence directory through absolute paths or `..` components;
- release payload files cannot be present without an entry in `SHA256SUMS.txt`;
- Android package/signing evidence includes `Package: io.github.sanskarin.sonic_nest`;
- Android hosted signing classification includes `Android Debug certificate / NON-PRODUCTION`;
- every evidence file is recorded with path, SHA-256, byte size, and payload/metadata role;
- platform build/signing/distribution classifications remain explicit;
- hosted candidate release classification remains `development-preview`;
- `stableReleaseApproved` is explicitly `false`.

Focused commit:

- `86e0bbab9b8e31c81c57814277f8f3ef41d34399` — `feat: add release candidate provenance manifest builder`.

### Direct and integration regression coverage

Added `tool/tests/test_release_candidate_manifest.py` with direct regression coverage for:

- successful complete five-platform manifest construction;
- tampered payload checksum rejection;
- release payload omitted from its checksum record;
- checksum path traversal rejection;
- Android non-production signing-state marker enforcement;
- missing platform evidence rejection;
- non-full source SHA rejection.

Focused commit:

- `252c71dc6c8a1b566ad544601ede954b7a35f365` — `test: cover release candidate manifest verification`.

Added `tool/tests/test_release_candidate_integration.py` so repository tests also require the maintained release-candidate workflow to retain:

- the final unified provenance job;
- platform artifact downloading through `actions/download-artifact@v4`;
- Android/Linux/Windows/macOS/iOS artifact arguments;
- exact source/run binding arguments;
- `RELEASE_CANDIDATE_MANIFEST.json` generation;
- `sonicnest-release-candidate-manifest` publication;
- permanent repository-audit execution of Python release-tool tests.

Focused commit:

- `3d4787afb00a3729f09dcfd2ad07189752dc5f88` — `test: lock release candidate manifest workflow integration`.

### Release-candidate workflow aggregation

The maintained `.github/workflows/release-candidate.yml` now contains a final **Unified candidate provenance manifest** job with `needs: [android, linux, windows, macos, ios]`.

The job cannot intentionally publish a complete provenance record until all five platform candidate jobs succeed. It then:

1. checks out the same source revision;
2. downloads the exact Android, Linux, Windows, macOS, and iOS candidate artifact sets;
3. invokes the manifest builder with `${GITHUB_SHA}`, `${GITHUB_RUN_ID}`, and `${GITHUB_RUN_ATTEMPT}`;
4. re-verifies the downloaded platform payload checksum evidence;
5. writes `RELEASE_CANDIDATE_MANIFEST.json`;
6. writes an explicit development-preview warning;
7. writes SHA-256 evidence for the JSON manifest itself;
8. uploads `sonicnest-release-candidate-manifest` with short validation retention.

Focused commit:

- `e6182098ce205ef9f6008c5bd1418055c12377c3` — `ci: publish unified release candidate provenance manifest`.

