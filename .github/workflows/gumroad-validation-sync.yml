name: One-shot Gumroad validation evidence sync

on:
  push:
    branches: [main]
    paths:
      - '.github/gumroad_validation_sync.py'
      - '.github/workflows/gumroad-validation-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure commit identity
        run: |
          git config user.name "Sanskar"
          git config user.email "sanskarin@outlook.in"
      - name: Record Gumroad validation evidence
        run: python3 .github/gumroad_validation_sync.py
      - name: Push evidence commits
        run: git push origin HEAD:main
