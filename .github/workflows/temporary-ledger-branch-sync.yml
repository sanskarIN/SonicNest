## Dependency-state drift found and fixed

A follow-up repository audit found concrete current-state documentation drift. `PROJECT_STATE.md` still described the older import/export and screen-wake dependency line after `pubspec.yaml` had already moved to the validated compatibility graph.

The stale current-state summary was:

- `file_picker 10.3.10 + share_plus 12.0.2`;
- `wakelock_plus 1.4.0`.

The maintained current-state summary is now synchronized to:

- `file_picker 12.0.0-beta.7`;
- `share_plus 13.3.0`;
- `wakelock_plus 1.7.0`.

The existing recorder, player, and FFmpeg stack summary remains aligned with the direct runtime constraints.

The same follow-up audit found a current-state `CHANGELOG.md` sentence that still described `file_picker 10.3.10` as the active pin. That sentence was corrected to the Android/AGP-compatible `12.0.0-beta.7` line and now records the already-completed v12 API migration rather than preserving an obsolete present-tense claim. Historical old dependency values elsewhere in this additive ledger remain historical evidence and are not rewritten as though they never existed.

## Permanent dependency-state integrity guard

Added `tool/verify_project_state_dependencies.py` so the human-readable project-state stack cannot silently drift from protected direct runtime dependency constraints in `pubspec.yaml`.

The verifier is standard-library-only and intentionally conservative. It protects the current recorder/player/processing/import-export/screen-wake relationships, normalizes simple caret constraints for project-state display, derives the maintained FFmpeg `major.minor.x` summary, and rejects missing protected dependencies, nested declarations, unsupported compound ranges, missing canonical stack entries, and exact summary mismatches.

Added `tool/tests/test_verify_project_state_dependencies.py` covering matching dependency state, caret normalization, stale import/export versions, stale screen-wake versions, missing required dependencies, nested protected dependency declarations, unsupported compound constraints, missing canonical stack structure, and CLI success/mismatch behavior.

Added `docs/DEPENDENCY_STATE.md` documenting the canonical source, protected relationships, current compatibility line, validation command, and the distinction between documentation integrity and real plugin/runtime/platform validation.

The permanent read-only Repository Integrity Audit now runs `python3 tool/verify_project_state_dependencies.py`. `tool/repository_audit.py` also requires the verifier, its regression test, its documentation, and the CI invocation so the integrity guard cannot be silently removed together with its enforcement surface.

`TODO.md` now marks only this repository-hygiene gap complete. No external/manual release gate was changed.

