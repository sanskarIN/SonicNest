name: Temporary branch ledger synchronization

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  append-ledger:
    if: >-
      github.event.issue.user.login == 'sanskarIN' &&
      github.event.issue.title == '[internal] sync SonicNest 2026-08-19 continuation ledger'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: automation/ledger-sync-20260819
          fetch-depth: 0
      - name: Append exact continuation ledger
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('what_changed.md')
          text = path.read_text(encoding='utf-8')
          marker = '# Continuation — 2026-08-19 — Release readiness and dependency-state integrity'
          if marker in text:
              raise SystemExit('Continuation marker already exists; refusing duplicate append.')

          addition = r'''


# Continuation — 2026-08-19 — Release readiness and dependency-state integrity

## Release-readiness bookkeeping

The repository now has deterministic release-readiness bookkeeping that keeps external stable-release gates visible without claiming they were performed.

- `tool/build_release_readiness_report.py` parses the canonical checklist sections in `TODO.md` and emits deterministic JSON plus optional Markdown.
- `tool/verify_release_readiness_report.py` independently validates report schema, summary/section reconciliation, pending-item integrity, and conservative stable-release approval.
- The permanent Repository Integrity Audit builds and verifies a fresh readiness snapshot from the real `TODO.md`.
- Parser, CLI, malformed-checklist, and independent-verifier regressions are covered under `tool/tests/`.
- Stable release approval remains false while physical-device, accessibility, sustained-workload, signing, distribution-console, translation-review, or final-release evidence remains incomplete.

