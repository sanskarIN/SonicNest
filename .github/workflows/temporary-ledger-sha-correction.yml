name: Temporary Ledger SHA Correction

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temporary-ledger-sha-correction.yml'

permissions:
  contents: write

jobs:
  correct-ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Correct exact validated package SHA and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          OLD='f2c773e1e03753ec62b9e4229a3f086871a26f29'
          NEW='f2c773e59b27a2aaac77e0590e20441ed7eba03f'
          grep -Fq "$OLD" what_changed.md
          sed -i "s/$OLD/$NEW/g" what_changed.md
          ! grep -Fq "$OLD" what_changed.md
          grep -Fq "$NEW" what_changed.md
          git rm .github/workflows/temporary-ledger-sha-correction.yml
          git config user.name 'Sanskar'
          git config user.email 'sanskarin@outlook.in'
          git add what_changed.md
          git commit -m 'docs: correct Linux validation commit in continuation ledger'
          git push origin HEAD:main
