name: One-shot clean-source validation dispatch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/zz-validation-dispatch.yml'

permissions:
  contents: write
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure commit identity
        run: |
          git config user.name "Sanskar"
          git config user.email "sanskarin@outlook.in"
      - name: Remove dispatcher from final tree
        run: |
          git rm .github/workflows/zz-validation-dispatch.yml
          git commit -m "chore: remove one-shot clean-source validation dispatch"
          git push origin HEAD:main
      - name: Dispatch maintained validations
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          for workflow in ci.yml windows.yml macos.yml linux-package.yml repository-audit.yml; do
            curl --fail-with-body -L \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/dispatches" \
              -d '{"ref":"main"}'
          done
