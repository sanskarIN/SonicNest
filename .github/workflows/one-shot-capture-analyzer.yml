name: One-shot analyzer diagnostic capture

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-capture-analyzer.yml'

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Linux audio prerequisites
        run: sudo apt-get update && sudo apt-get install -y ffmpeg pulseaudio-utils libjson-glib-dev
      - name: Generate platform hosts
        run: bash tool/bootstrap_platforms.sh
      - name: Resolve dependencies
        run: flutter pub get
      - name: Generate deterministic branding source images
        run: dart tool/generate_brand_assets_v2.dart
      - name: Capture analyzer output
        shell: bash
        run: |
          set +e
          flutter analyze --no-fatal-infos > .github/manual-qa-analyzer-diagnosis.txt 2>&1
          status=$?
          printf '\nANALYZER_EXIT_CODE=%s\n' "$status" >> .github/manual-qa-analyzer-diagnosis.txt
          exit 0
      - name: Commit analyzer diagnosis only
        run: |
          git config user.name "Sanskar"
          git config user.email "sanskarin@outlook.in"
          git add -f .github/manual-qa-analyzer-diagnosis.txt
          git commit -m "ci: record manual QA analyzer diagnosis"
          git restore --worktree .
          git pull --rebase origin main
          git push origin HEAD:main
