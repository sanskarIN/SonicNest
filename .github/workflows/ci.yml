name: Flutter CI

on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'test/**'
      - 'tool/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'analysis_options.yaml'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'lib/**'
      - 'test/**'
      - 'tool/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'analysis_options.yaml'
      - '.github/workflows/ci.yml'

permissions:
  contents: read

concurrency:
  group: sonicnest-ci-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Verify committed Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test tool/generate_brand_assets_v2.dart
      - name: Install Linux audio prerequisites
        run: sudo apt-get update && sudo apt-get install -y ffmpeg pulseaudio-utils libjson-glib-dev
      - name: Generate platform hosts
        run: bash tool/bootstrap_platforms.sh
      - name: Resolve dependencies
        run: flutter pub get
      - name: Generate deterministic branding source images
        run: dart tool/generate_brand_assets_v2.dart
      - name: Static analysis
        run: flutter analyze --no-fatal-infos
      - name: Unit tests
        run: flutter test

  android:
    name: Android debug build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate platform hosts
        run: bash tool/bootstrap_platforms.sh
      - run: flutter pub get
      - name: Apply SonicNest native branding
        run: bash tool/apply_branding.sh
      - run: flutter build apk --debug

  linux:
    name: Linux debug build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev ffmpeg pulseaudio-utils libjson-glib-dev
      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop
      - name: Generate platform hosts
        run: bash tool/bootstrap_platforms.sh
      - run: flutter pub get
      - name: Generate deterministic branding source images
        run: dart tool/generate_brand_assets_v2.dart
      - run: flutter build linux --debug
