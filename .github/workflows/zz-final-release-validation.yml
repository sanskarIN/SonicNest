name: One-shot final release validation dispatcher

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/zz-final-release-validation.yml'

permissions:
  contents: write
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Configure commit identity
        run: |
          git config user.name "Sanskar"
          git config user.email "sanskarin@outlook.in"
      - name: Remove one-shot helper from main
        run: |
          git rm .github/workflows/zz-final-release-validation.yml
          git commit -m "chore: remove one-shot final release validation dispatcher"
          git push origin main
      - name: Dispatch clean release-candidate validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release-candidate.yml --ref main
      - name: Dispatch clean repository audit
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run repository-audit.yml --ref main
